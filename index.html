<style>
/* Layout: cabeçalho compacto (saudação, progresso do dia, histórico e quadrado da data), três painéis que deslizam (Tarefas, Hábitos, Diário) feitos de cartões suaves, e a barra de abas embaixo. A cor de destaque muda com a aba ativa. */
:root {
  --fs-1: 12px; --fs-2: 14px; --fs-3: 16px; --fs-4: 20px; --fs-5: 28px;
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #14181F;
  --muted: #5B6572;
  --line: #E1E5EB;
  --accent: #1F7A5A;
  --accent-ink: #FFFFFF;
  --soft: #DDEDE4;
  --warm: #9A5F08;
  --paper: #FFFFFF;
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-line: rgba(255, 255, 255, 0.75);
  --glass-hi: rgba(255, 255, 255, 0.95);
  --glass-sheen: rgba(255, 255, 255, 0.55);
  --glass-shadow: rgba(20, 24, 31, 0.18);
  --hd: #0B7BA8; --hd-soft: #D9EDF6; --hd-ink: #FFFFFF;
  --c0: #D6457A; --c1: #D9651B; --c2: #2E9E6B; --c3: #3F6FD0; --c4: #8A4FD0; --c5: #14948F; --c6: #9A7B00; --c7: #6F7F88;
  --m1: #C8372D;
  --m2: #3F6FD0;
  --m3: #6F7F88;
  --m4: #2E9E6B;
  --m5: #D18F00;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
.wrap[data-tab="1"] { --accent: #6B4FB8; --soft: #E9E3F6; }
.wrap[data-tab="2"] { --accent: #B5600A; --soft: #F8E9D8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1318; --surface: #181D24; --ink: #E8ECF1; --muted: #9AA5B1; --line: #272E38;
    --accent: #54C79B; --accent-ink: #08140F; --soft: #1B2B25; --warm: #E6A23C;
    --hd: #5CC8F0; --hd-soft: #16303B; --hd-ink: #04141C; --c0: #F07AA3; --c1: #F29A58; --c2: #4FC594; --c3: #7FA2F0; --c4: #B896F0; --c5: #4FD0C8; --c6: #E6C24A; --c7: #A3B0B8;
    --m1: #F0716A; --m2: #7FA2F0; --m3: #A3B0B8; --m4: #4FC594; --m5: #F0BC3A;
  --glass-bg: rgba(40, 48, 60, 0.5); --glass-line: rgba(255, 255, 255, 0.16); --glass-hi: rgba(255, 255, 255, 0.25); --glass-sheen: rgba(255, 255, 255, 0.14); --glass-shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .wrap[data-tab="1"] { --accent: #B49CF0; --accent-ink: #140C2A; --soft: #2A2342; }
  :root:not([data-theme="light"]) .wrap[data-tab="2"] { --accent: #F0A04B; --accent-ink: #2A1604; --soft: #3A2A19; }
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #181D24; --ink: #E8ECF1; --muted: #9AA5B1; --line: #272E38;
  --accent: #54C79B; --accent-ink: #08140F; --soft: #1B2B25; --warm: #E6A23C;
  --hd: #5CC8F0; --hd-soft: #16303B; --hd-ink: #04141C; --c0: #F07AA3; --c1: #F29A58; --c2: #4FC594; --c3: #7FA2F0; --c4: #B896F0; --c5: #4FD0C8; --c6: #E6C24A; --c7: #A3B0B8;
  --m1: #F0716A; --m2: #7FA2F0; --m3: #A3B0B8; --m4: #4FC594; --m5: #F0BC3A;
  --glass-bg: rgba(40, 48, 60, 0.5); --glass-line: rgba(255, 255, 255, 0.16); --glass-hi: rgba(255, 255, 255, 0.25); --glass-sheen: rgba(255, 255, 255, 0.14); --glass-shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
:root[data-theme="dark"] .wrap[data-tab="1"] { --accent: #B49CF0; --accent-ink: #140C2A; --soft: #2A2342; }
:root[data-theme="dark"] .wrap[data-tab="2"] { --accent: #F0A04B; --accent-ink: #2A1604; --soft: #3A2A19; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--fs-3);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  padding-block: 18px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
header { flex: none; position: relative; --accent: var(--hd); --soft: var(--hd-soft); --accent-ink: var(--hd-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* Cabeçalho */
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(21px, 5.6vw, 34px); line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; min-width: 0; }
.head-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--ink); }
.icon-btn:hover { background: var(--soft); }
.tile { width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 0; overflow: hidden; display: flex; flex-direction: column; align-items: stretch; text-align: center; }
.tile-top { background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 0; }
.tile-num { flex: 1; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; }
.tile.other { box-shadow: 0 0 0 2px var(--accent); }
.tile[aria-expanded="true"] { border-color: var(--accent); }
.day { margin-top: 14px; }
.bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.35s ease; }
.day-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-top: 8px; min-height: 28px; font-size: var(--fs-2); color: var(--muted); }
.day-meta p { margin: 0; }
.pill-btn { background: var(--soft); color: var(--accent); border: 0; border-radius: 99px; padding: 5px 12px; font-size: var(--fs-2); font-weight: 700; }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.sample { margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: var(--soft); display: flex; gap: 8px 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: var(--fs-2); flex: none; }
.sample p { margin: 0; flex: 1 1 200px; min-width: 0; }

/* Calendário */
.cal { position: absolute; right: 0; top: 74px; z-index: 30; width: min(340px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22); }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-title { font-family: var(--f-display); font-weight: 700; font-size: var(--fs-3); }
.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 12px; text-align: center; font-size: var(--fs-1); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 6px; }
.cal-day { background: none; border: 0; padding: 3px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); min-width: 0; }
.cal-day .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-3); border: 2px solid transparent; }
.cal-day:hover .num:not(.mood) { background: var(--soft); }
.cal-day .num.mood { border-color: var(--mc); background: var(--surface); background: color-mix(in srgb, var(--mc) 24%, var(--surface)); }
.cal-day.other { color: var(--muted); opacity: 0.55; }
.cal-day.today .num { font-weight: 800; }
.cal-day.today .num:not(.mood) { color: var(--accent); }
.cal-day.sel .num { outline: 2px solid var(--ink); outline-offset: 2px; }
.tdot { width: 8px; height: 8px; border-radius: 50%; display: block; }
.tdot.pend { background: var(--paper); border: 1.5px solid var(--muted); }
.tdot.ok { background: var(--m4); }
.tdot.none { visibility: hidden; }
.sin-n { font-size: 10px; font-weight: 800; line-height: 8px; height: 8px; color: var(--accent); font-style: normal; }
b.sin-n { font-size: 11px; height: auto; line-height: 1; }
.cal-foot { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cal-legend { display: flex; gap: 12px; font-size: var(--fs-1); color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }

/* Painéis que deslizam */
.pager { flex: 1; min-height: 0; margin: 14px calc(-1 * var(--gr)) 0 calc(-1 * var(--gl)); display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.pager::-webkit-scrollbar { display: none; }
.panel { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; padding: 2px var(--gr) 160px var(--gl); }

/* Barra flutuante em vidro */
.tabs { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: min(360px, calc(100% - 32px)); z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; border-radius: 999px;
  background: var(--surface); background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-line);
  box-shadow: 0 12px 32px var(--glass-shadow), inset 0 1px 1px var(--glass-hi), inset 0 -1px 1px var(--glass-line), inset 0 0 14px var(--glass-sheen); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .tabs { background: var(--surface); } }
.tabs::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(165deg, var(--glass-sheen), transparent 42%); }
.glass-ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: 999px; translate: calc(var(--p, 0) * 100%) 0; will-change: translate, scale; pointer-events: none; touch-action: none;
  transition: scale 0.5s cubic-bezier(0.3, 1.6, 0.5, 1), background-color 0.25s, box-shadow 0.25s;
  background: var(--soft); background: color-mix(in srgb, var(--accent) 20%, transparent);
  -webkit-backdrop-filter: blur(6px) saturate(1.6); backdrop-filter: blur(6px) saturate(1.6);
  box-shadow: inset 0 1px 1px var(--glass-hi), inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent); }
.tab { position: relative; z-index: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 7px 0 6px; font-size: var(--fs-1); font-weight: 700; color: var(--muted); min-width: 0; border-radius: 999px; }
.tab .pill { display: grid; place-items: center; }
.tab[aria-selected="true"] { color: var(--accent); }

/* Cartões e formulários */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.add { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.add-line { display: flex; gap: 8px; }
.add-line input[type="text"] { flex: 1; min-width: 0; }
input[type="text"], input[type="password"], input[type="time"], input[type="date"], input[type="number"], select, textarea {
  font: inherit; font-size: var(--fs-3); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-width: 100%;
}
textarea { width: 100%; resize: vertical; min-height: 92px; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.9; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.btn.wide { align-self: flex-start; }

.more summary { cursor: pointer; color: var(--muted); font-size: var(--fs-2); font-weight: 600; width: fit-content; padding: 2px 0; }
.more-body { display: flex; flex-wrap: wrap; gap: 10px 14px; padding: 10px 0 2px; align-items: flex-end; }
.fld { display: flex; flex-direction: column; gap: 4px; margin: 0 0 14px; font-size: var(--fs-2); color: var(--muted); }
.fld > span { font-weight: 700; }
.more-body .fld, .add .fld { margin: 0; }
.fld.inline .inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.add .fld.inline { flex-direction: row; align-items: center; gap: 12px; }
.add .fld.inline select { flex: 1; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 100%; margin: 0 0 14px; }
.more-body .chips { margin: 0; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: var(--fs-2); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 12px; margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.row.is-done { opacity: 0.62; }
.check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; color: transparent; padding: 0; transition: background 0.15s, transform 0.15s; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check:active { transform: scale(0.9); }
.txt-btn { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 0; text-align: left; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; overflow-wrap: anywhere; }
.txt-btn.done .txt-main { text-decoration: line-through; text-decoration-thickness: 1px; }
.time { background: var(--soft); color: var(--accent); border-radius: 99px; padding: 1px 9px; font-size: var(--fs-1); font-weight: 700; }
.rep { display: inline-flex; color: var(--muted); }
.tag { background: var(--soft); color: var(--warm); border-radius: 99px; padding: 1px 9px; font-size: var(--fs-1); font-weight: 700; white-space: nowrap; }
.x { flex: none; width: 34px; height: 34px; border: 0; background: none; color: var(--muted); border-radius: 50%; display: grid; place-items: center; padding: 0; }
.x:hover { color: var(--ink); background: var(--soft); }
.empty { color: var(--muted); font-size: var(--fs-3); padding: 22px 8px; margin: 0; text-align: center; }

/* Hábitos */
.week-cap { margin: 16px 2px 0; font-size: var(--fs-2); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.weekhead, .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; justify-items: center; }
.weekhead { margin: 8px 16px 0; font-size: var(--fs-1); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.weekhead .hoje { color: var(--accent); }
.habit { margin-top: 8px; padding: 12px 14px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.habit-top { display: flex; align-items: center; gap: 8px; }
.habit-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; background: none; border: 0; padding: 2px 0; text-align: left; }
.habit-sub { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin: 2px 0 10px; font-size: var(--fs-2); color: var(--muted); }
.habit-sub b { color: var(--ink); font-weight: 700; }
.habit-sub .hit { color: var(--accent); font-weight: 700; }
.streak { color: var(--warm); font-weight: 700; }
.dot { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; color: transparent; padding: 0; }
.dot.today { border-color: var(--accent); }
.dot.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.dot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot:disabled { opacity: 0.35; cursor: default; }
.step { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; display: grid; place-items: center; padding: 0; flex: none; }
.step:hover { border-color: var(--accent); }

/* Diário */
.label { margin: 0 0 10px; font-size: var(--fs-2); font-weight: 700; color: var(--muted); }
.faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.face-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--bg); border: 2px solid transparent; border-radius: 16px; padding: 10px 2px 8px; color: var(--mc); font-size: var(--fs-1); font-weight: 700; }
.face-btn .fi { width: 100%; max-width: 44px; aspect-ratio: 1; }
.face-btn span.nm { color: var(--ink); }
.face-btn[aria-checked="true"] { border-color: var(--mc); background: var(--surface); background: color-mix(in srgb, var(--mc) 16%, var(--surface)); }
.mood-note { margin: 10px 0 0; font-size: var(--fs-2); color: var(--muted); }
.nrow { margin-top: 8px; padding: 12px 6px 12px 14px; display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.nbody { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.nmeta { font-size: var(--fs-1); font-weight: 700; color: var(--accent); display: block; margin-bottom: 4px; }
.ntext { white-space: pre-wrap; overflow-wrap: anywhere; display: block; }

/* Histórico (tela cheia) */
.hist-view { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.hist-inner { max-width: 720px; margin: 0 auto; }
.hist-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: var(--fs-5); letter-spacing: -0.02em; margin: 0; }
.hist-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
.hist-title { font-family: var(--f-display); font-weight: 700; font-size: var(--fs-4); }
h3.sub { font-family: var(--f-display); font-weight: 700; font-size: var(--fs-4); margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h3.sub small { font-family: var(--f-body); font-size: var(--fs-2); font-weight: 600; color: var(--muted); }
.bars { display: grid; gap: 2px; align-items: end; height: 76px; border-bottom: 1px solid var(--line); }
.bar-col { display: flex; align-items: flex-end; height: 100%; }
.bar-col span { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }
.bar-col span.zero { background: var(--line); height: 2px; border-radius: 0; }
.bar-lbls { display: grid; gap: 2px; margin-top: 4px; font-size: 10px; color: var(--muted); }
.bar-lbls span { white-space: nowrap; }
.hrow { padding: 12px 14px; margin-top: 8px; }

:root[data-theme="dark"] #panel-diary { --accent: #F0A04B; --accent-ink: #2A1604; --soft: #3A2A19; }

.head-actions { position: relative; }
.cloud-ic { position: absolute; top: -12px; right: -8px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--muted); z-index: 3; }
.cloud-ic[hidden] { display: none; }
.cloud-ic svg { width: 14px; height: 14px; }
.cloud-ic[data-s="ok"] { color: #1F9D6B; } .cloud-ic[data-s="err"] { color: #D98A00; }
.cloud-ic[data-s="busy"] svg { animation: spin .9s linear infinite; }
#lockView { position: fixed; inset: 0; z-index: 500; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
html.locked #lockView { display: flex; visibility: visible; }
html.locked main.wrap, html.locked .hist-view, html.locked .sheet-back { visibility: hidden; }
#lockView h2 { margin: 0; font-size: var(--fs-4, 20px); }
.lock-dots { display: flex; gap: 12px; height: 16px; }
.lock-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
.lock-dots i.on { background: var(--accent); }
.lock-msg { min-height: 20px; margin: 0; color: var(--muted); font-size: var(--fs-2); text-align: center; }
.lock-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; }
.lock-pad button { height: 72px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 26px; font-weight: 700; padding: 0; }
.lock-pad button:active { background: var(--soft); }
.lock-pad .ok { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lock-fg { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
.lock-fg[hidden], .lock-pad[hidden] { display: none; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.lock-dots.bad { animation: shake .3s; }
.love-ctr { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 8px 0 12px; }
.love-ctr b { font-size: 44px; min-width: 70px; text-align: center; color: var(--accent); }
.love-ctr button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 28px; font-weight: 700; padding: 0; }
.love-ctr button:disabled { opacity: .35; }
.rate-faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0 6px; }
.cp-sec { margin-top: 14px; padding: 16px; }
.cp-sec h3 { margin: 0 0 4px; font-size: var(--fs-3, 17px); }
.cp-stat { display: flex; gap: 8px; margin: 6px 0 8px; }
.cp-stat div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 12px; background: var(--soft); }
.cp-stat b { display: block; font-size: var(--fs-4, 20px); color: var(--accent); }
.cp-stat span { font-size: var(--fs-1); color: var(--muted); }

.cp-ann { margin-top: 12px; padding: 12px 14px; font-weight: 700; color: var(--accent); background: var(--soft); text-align: center; }
.cp-ann.today { background: var(--accent); color: var(--accent-ink); }
.cp-ann-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cp-ann-row input { flex: 1; min-width: 150px; }
.wish-add { display: flex; gap: 8px; }
.wish-add input { flex: 1; min-width: 0; }
.wish-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wish { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 12px; background: var(--bg); }
.wish span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.wish.done span { text-decoration: line-through; color: var(--muted); }
.wchk { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; color: transparent; padding: 0; display: grid; place-items: center; }
.wchk svg { width: 16px; height: 16px; }
.wish.done .wchk { background: var(--accent); color: var(--accent-ink); }

.set-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.set-head h3 { margin: 0 !important; }
.set-card { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin: 0 0 12px; }
.set-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: var(--fs-2); margin-bottom: 10px; }
.set-ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.set-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.set-lb { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.set-lb b { font-size: var(--fs-2); }
.set-lb small, .acc-line small { font-size: var(--fs-1); color: var(--muted); }
.set-card .chips { margin: 0; }
.acc-line { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.acc-line > div { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.sw { flex: none; width: 52px; height: 30px; border-radius: 99px; border: 0; background: var(--line); position: relative; padding: 0; transition: background-color .2s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"] i { transform: translateX(22px); }
.set-card .btn.dng, .btn.dng { color: #C0392B; border-color: color-mix(in srgb, #C0392B 40%, var(--line)); }
.set-card.danger { background: color-mix(in srgb, #C0392B 6%, var(--bg)); }
.blk-bar { display: flex; align-items: center; gap: 8px; margin: 14px 2px 6px; font-weight: 700; font-size: var(--fs-2); color: var(--accent); }
.blk-bar span { flex: 1; }
.blk-bar button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: var(--fs-1); }
.blk-bar button:disabled { opacity: .35; }
.editing .blk > :not(.blk-bar) { pointer-events: none; opacity: .7; }
.blk-add { width: 100%; margin-top: 14px; padding: 12px; border: 2px dashed var(--line); background: none; color: var(--muted); border-radius: 16px; font-weight: 700; }
.blk-hid { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; font-weight: 700; }
.blk-hid button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 22px; padding: 0; }
.meta-row { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 12px; background: var(--bg); margin-top: 6px; }
.meta-row .mt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.meta-row .mt small { display: block; color: var(--muted); font-size: var(--fs-1); }
.meta-row.done .mt b { text-decoration: line-through; color: var(--muted); }
.meta-row .ok { border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: var(--fs-1); }
.meta-ask { display: flex; gap: 8px; margin: 8px 0; }
.meta-ask .chip { flex: 1; }
.meta-form textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; }

.sin-chip { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 99px; font-style: normal; font-weight: 700; font-size: var(--fs-1); background: var(--soft); color: var(--accent); width: fit-content; }
.sin-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.sin-big b { font-size: 44px; line-height: 1; color: var(--accent); margin-right: 8px; }
.sin-big span { color: var(--muted); font-size: var(--fs-2); font-weight: 700; }
.sin-diff { font-weight: 700; font-size: var(--fs-2); padding: 4px 10px; border-radius: 99px; }
.sin-diff.up { background: color-mix(in srgb, #1F9D6B 16%, transparent); color: #1F9D6B; }
.sin-diff.down { background: color-mix(in srgb, #D98A00 16%, transparent); color: #B87500; }
.sin-hit { cursor: pointer; }
.sin-detail { margin-top: 8px; padding: 12px; border-radius: 14px; background: var(--soft); display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-2); }
.sin-row { display: grid; grid-template-columns: 1fr 90px 28px; gap: 8px; align-items: center; }
.sin-row i { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 18%, transparent); overflow: hidden; display: block; }
.sin-row u { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.sin-row em { font-style: normal; font-weight: 700; text-align: right; }
</style></head>

    achSoon();
    if (achOn) renderAch();
    var now = new Date();
    var today = ymd(now);
    var h = now.getHours();
    var per = h < 5 ? 0 : h < 12 ? 1 : h < 18 ? 2 : 3;
    applyTheme();
    var stt = state.settings;
    $('#greeting').textContent = ['Boa madrugada', 'Bom dia', 'Boa tarde', 'Boa noite'][per] + (stt.name ? ', ' + stt.name : '');
    lastBucket = per + '-' + (h >= 21 ? 1 : 0) + '-' + today;
    var ic = $('#helloIc');
    if (ic.getAttribute('data-p') !== String(per)) {
      ic.setAttribute('data-p', per);
      var sv = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
      $('#helloBadge').innerHTML = sv + [
        '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><path d="M17 4v3M15.5 5.5h3"/>',
        '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
        '<circle cx="9" cy="9" r="3"/><path d="M9 2.5v1.2M3.2 5.2l.9.9M2.5 11h1.2M14.8 5.2l-.9.9"/><path d="M8 20h9a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 8 14a3 3 0 0 0 0 6z"/>',
        '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'
      ][per] + '</svg>';
    }
    var avk = stt.avatar + '|' + (stt.name || '').charAt(0);
    if (ic.getAttribute('data-k') !== avk) {
      ic.setAttribute('data-k', avk);
      $('#helloAv').innerHTML = (stt.avatar >= 0 && AVATARS[stt.avatar]) ? avHtml(stt.avatar, stt.name) : stt.name ? avHtml(-1, stt.name) : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>';
    }
    renderProfile(); updCloudIc();
    $('#sampleNote').hidden = !state.sample;
    var bkDue = false, bkMsg = '';
    if (STANDALONE && !state.sample && (state.tasks.length + state.series.length + state.habits.length + state.notes.length) > 0 && Date.now() >= stt.snoozeUntil) {
      var bkDays = Math.floor((Date.now() - (stt.lastBackup || stt.since)) / 86400000);
      if (bkDays >= 14) { bkDue = true; bkMsg = stt.lastBackup ? 'Faz ' + bkDays + ' dias do último backup. Exporte para não perder seus dados.' : 'Você ainda não fez um backup. Exporte para não perder seus dados.'; }
    }
    $('#backupNote').hidden = !bkDue;
    $('#backupText').textContent = bkMsg;

    var sk = selKey();
    var sd = parseKey(sk);
    $('#tileMonth').textContent = DIAS[sd.getDay()] + ' · ' + MESES_C[sd.getMonth()];
    $('#tileDay').textContent = sd.getDate();
    $('#dateTile').classList.toggle('other', sk !== today);
    $('#dateTile').setAttribute('aria-label', 'Escolher data. Dia selecionado: ' + sd.getDate() + ' de ' + MESES[sd.getMonth()]);
    $('#backToday').hidden = sk === today;
    $('#taskInput').placeholder = sk === today ? 'Nova tarefa' : 'Nova tarefa para ' + shortDate(sk);
    if (calOpen) renderCal();

    /* progresso do dia escolhido */
    var pr = dayProgress(sk, today);
    var pct = pr.total ? Math.round(pr.done / pr.total * 100) : 0;
    $('#ringFill').style.strokeDashoffset = (163.363 * (1 - pct / 100)).toFixed(2);
    $('#statw').setAttribute('aria-valuenow', pct);
    $('#ringTx').textContent = pr.done + '/' + pr.total;
    $('#dayBox').hidden = sk === today;

    if (obOn && state.settings.welcomed) obClose();
    if (coupleOpen) { coupleHeader(); updateCoupleBtn(); renderCouple(); runFx(); return; }

    /* tarefas */
    var items = itemsFor(sk, today);
    if (catFilter && !catById(catFilter)) catFilter = '';
    var fh2 = '';
    if ((state.cats || []).length) {
      fh2 = '<button type="button" class="chip" data-act="cat-filter" data-cat="" aria-pressed="' + (!catFilter) + '">Todas</button>' + state.cats.map(function (c) {
        return '<button type="button" class="chip" data-act="cat-filter" data-cat="' + esc(c.id) + '" style="--cc:var(--c' + c.color + ')" aria-pressed="' + (c.id === catFilter) + '">' + esc(c.name) + '</button>';
      }).join('');
    }
    fh2 += '<button type="button" class="chip ghostchip" data-act="cat-manage">' + ((state.cats || []).length ? 'Editar' : '+ Etiqueta') + '</button>';
    $('#catFilter').innerHTML = fh2;
    renderFormCats();
    syncWhen();
    renderFeed(today, sk);

    /* fechamento do dia (depois das 21h, só hoje) */
    var cc = $('#closeCard');
    var showCl = h >= 21 && sk === today && !state.moods[today] && stt.closeDismissed !== today;
    cc.hidden = !showCl;
    if (showCl) {
      var tTot = items.length, tDone = items.filter(function (x) { return x.done; }).length;
      var ahs = state.habits.filter(function (x) { return habitActive(x, today); }), hDone = ahs.filter(function (x) { return x.days[today]; }).length;
      var parts = [];
      if (tTot) parts.push('concluiu ' + tDone + ' de ' + tTot + (tTot === 1 ? ' tarefa' : ' tarefas'));
      if (ahs.length) parts.push('marcou ' + hDone + ' de ' + ahs.length + (ahs.length === 1 ? ' hábito' : ' hábitos'));
      cc.innerHTML = '<h3>Fechamento do dia</h3><p>' + (parts.length ? 'Hoje você ' + parts.join(' e ') + '. Como foi o dia?' : 'Como foi o seu dia?') + '</p>' +
        '<div class="cbtns"><button type="button" class="btn" data-act="close-go">Registrar o dia</button><button type="button" class="link-btn" data-act="close-dismiss">Agora não</button></div>';
    }

    /* hábitos (semana do dia escolhido) */
    var ws = weekStart(sd);
    var we = addDays(ws, 6);
    $('#weekCaption').textContent = 'Semana ' + weekNum(ws) + ' · ' + ws.getDate() + (ws.getMonth() !== we.getMonth() ? ' ' + MESES_C[ws.getMonth()] : '') + ' a ' + we.getDate() + ' ' + MESES_C[we.getMonth()];
    var wh = '';
    for (var i = 0; i < 7; i++) {
      var d0 = addDays(ws, i);
      wh += '<span class="' + (ymd(d0) === today ? 'hoje' : '') + '">' + DIAS[d0.getDay()] + '</span>';
    }
    $('#weekHead').innerHTML = wh;
    var wsK = ymd(ws), weK = ymd(we);
    var hs = state.habits.filter(function (x) { return x.start <= weK && (!x.end || x.end >= wsK); });
    $('#weekHead').style.display = hs.length ? '' : 'none';
    $('#habitList').innerHTML = hs.length ? hs.map(function (hb) {
      var n = 0, an = 0, dots = '';
      for (var i = 0; i < 7; i++) {
        var dd = addDays(ws, i), key = ymd(dd), on = !!hb.days[key], future = key > today, act = habitActive(hb, key);
        if (on) n++;
        if (act) an++;
        dots += '<button type="button" class="dot' + (act ? '' : ' off') + (key === today ? ' today' : '') + (key === sk ? ' sel' : '') + '" aria-pressed="' + on + '" aria-label="' + esc(hb.name) + ', ' + DIAS[dd.getDay()] + ' ' + dd.getDate() + '"' + (future || !act ? ' disabled' : '') + ' data-act="habit-toggle" data-id="' + esc(hb.id) + '" data-day="' + key + '">' + CHECK + '</button>';
      }
      var sub;
      if (hb.target > 0) {
        var hit = n >= hb.target;
        sub = '<span>' + hb.target + (hb.target === 1 ? ' vez' : ' vezes') + ' por semana</span><span class="' + (hit ? 'hit' : '') + '"><b>' + n + '</b> de ' + hb.target + (hit ? ' · meta batida' : '') + '</span>';
      } else {
        var s = streak(hb);
        sub = '<span>Todo dia</span><span><b>' + n + '</b>/' + (an || 7) + '</span>' + (s >= 2 ? '<span class="streak">' + FLAME + ' ' + s + ' dias seguidos</span>' : '');
      }
      return '<div class="habit"><div class="habit-top"><button type="button" class="habit-name" data-act="habit-edit" data-id="' + esc(hb.id) + '" aria-label="Editar hábito: ' + esc(hb.name) + '">' + esc(hb.name) + '</button>' +
        '<button type="button" class="x" aria-label="Remover hábito: ' + esc(hb.name) + '" data-act="habit-del" data-id="' + esc(hb.id) + '">' + XICON + '</button></div>' +
        '<div class="habit-sub">' + sub + '</div>' +
        '<div class="week">' + dots + '</div></div>';
    }).join('') : '<p class="empty">Adicione um hábito para acompanhar a semana.</p>';

    /* diário: humor e notas */
    var mv = state.moods[sk] || 0;
    var fh = '';
    for (var m = 1; m <= 5; m++) {
      fh += '<button type="button" class="face-btn" role="radio" aria-checked="' + (mv === m) + '" style="--mc:var(--m' + m + ')" data-act="mood-set" data-v="' + m + '" aria-label="' + MOODS[m - 1] + '">' + face(m) + '<span class="nm">' + MOODS[m - 1] + '</span></button>';
    }
    $('#faces').innerHTML = fh;
    $('#moodNote').textContent = mv ? 'Humor registrado: ' + MOODS[mv - 1] + '. Toque de novo para limpar.' : 'Toque numa carinha para registrar o dia.';
    var dayNotes = state.notes.filter(function (n) { return n.date === sk; }).sort(function (a2, b2) { return b2.created - a2.created; });
    var hasNote = dayNotes.length > 0, coll = false;
    $('#dFull').hidden = coll;
    $('#dSum').hidden = !coll;
    if (coll) $('#dSum').innerHTML = '<span class="dsf" style="--mc:var(--m' + mv + ')">' + face(mv) + '</span><span class="dst">Sentimentos registrados</span><button type="button" class="link-btn" data-act="d-edit">Mudar sentimentos</button>';
    var fk = sk + '|' + (hasNote ? dayNotes[0].id + '|' + dayNotes[0].text : '');
    if (noteFormKey !== fk) { noteFormKey = fk; $('#noteInput').value = hasNote ? dayNotes[0].text : ''; }
    $('#noteForm .btn').textContent = hasNote ? 'Salvar alterações' : 'Salvar nota';
    var dk = sk + '|' + hasNote + '|' + !!mv + '|' + coll;
    if (dk !== lastDk) {
      lastDk = dk;
      if (!coll) { var pg2 = !hasNote ? 0 : !mv ? 1 : 0; requestAnimationFrame(function () { dPage(pg2, true); }); }
    }
    var dn = {};
    state.notes.forEach(function (n) { (dn[n.date] = dn[n.date] || []).push(n); });
    function noteRow(n) {
      return '<div class="nrow"><button type="button" class="nbody" data-act="note-edit" data-id="' + esc(n.id) + '" aria-label="Editar nota das ' + hhmm(n.created) + '"><span class="nmeta">' + hhmm(n.created) + '</span><span class="ntext">' + esc(n.text) + '</span>' + (state.moods[n.date] ? '<span class="nmood" style="--mc:var(--m' + state.moods[n.date] + ')" role="img" aria-label="Humor do dia: ' + MOODS[state.moods[n.date] - 1] + '">' + face(state.moods[n.date]) + '<span>' + MOODS[state.moods[n.date] - 1] + '</span></span>' : '') + '</button>' +
        '<button type="button" class="x" aria-label="Remover nota" data-act="note-del" data-id="' + esc(n.id) + '">' + XICON + '</button></div>';
    }
    function noteSec(key) {
      var ns = (dn[key] || []).slice().sort(function (a2, b2) { return b2.created - a2.created; });
      return '<section class="fday" data-anchor="' + key + '"><h4 class="fday-h"><b>' + dayLabel(key, today) + '</b>' + (Math.abs(dayDiff(key, today)) <= 1 ? '<small>' + esc(longDate(key)) + '</small>' : '') + '</h4>' +
        (ns.length ? ns.map(noteRow).join('') : '<p class="empty">Nenhuma nota neste dia.</p>') + '</section>';
    }
    var older = Object.keys(dn).filter(function (k) { return k < sk; }).sort().reverse();
    diaryMore = older.length > diaryCount;
    var nsc = $('#noteScroll'), aD = anchorD;
    anchorD = false;
    anchorWrap(nsc, aD, function () {
      $('#noteMore').hidden = !diaryMore;
      patchList($('#noteList'), older.slice(0, diaryCount).reverse().map(noteSec).concat([noteSec(sk)]));
    });
    $('#noteList').style.minHeight = nsc.clientHeight + 'px';
    if (!diaryInit && nsc.clientHeight) { diaryInit = true; scrollDiaryTo(sk); }

    if (histOpen) renderHistory(today);
    coupleHeader();
    updateCoupleBtn();
    if (obOn && state.settings.welcomed) obClose();
    if (coupleOpen) renderCouple();
    runFx();
  }

  function renderHistory(today) {
    var m = histMonth;
    var y = m.getFullYear(), mo = m.getMonth();
    var n = new Date(y, mo + 1, 0).getDate();
    var prefix = y + '-' + pad(mo + 1) + '-';
    $('#histTitle').textContent = cap(MESES[mo]) + ' ' + y;
    var tdy = parseKey(today);
    var elapsed = (tdy.getFullYear() === y && tdy.getMonth() === mo) ? tdy.getDate() : ((y < tdy.getFullYear() || (y === tdy.getFullYear() && mo < tdy.getMonth())) ? n : 0);

    /* atividades do mês: tarefas, hábitos e diário (no máximo 1 por dia) */
    var dbd = doneByDate(), diaryDays = {};
    state.notes.forEach(function (nt) { diaryDays[nt.date] = 1; });
    var rowsD = [], maxD = 0, tT = 0, tH = 0, tN = 0, bars = '', lbls = '';
    for (var d = 1; d <= n; d++) {
      var kd = prefix + pad(d), ct = dbd[kd] || 0, ch = 0, cn = diaryDays[kd] ? 1 : 0;
      state.habits.forEach(function (hb) { if (hb.days[kd]) ch++; });
      tT += ct; tH += ch; tN += cn;
      rowsD.push([ct, ch, cn]);
      if (ct + ch + cn > maxD) maxD = ct + ch + cn;
    }
    rowsD.forEach(function (r, i) {
      var seg = function (v, col) { return v ? '<span style="height:' + (v / maxD * 100).toFixed(1) + '%;background:var(' + col + ')"></span>' : ''; };
      bars += '<button type="button" class="bar-col stk" data-act="bar-pick" data-d="' + (i + 1) + '" data-t="' + r[0] + '" data-h="' + r[1] + '" data-n="' + r[2] + '" aria-label="Dia ' + (i + 1) + ': ' + r[0] + ' tarefas, ' + r[1] + ' hábitos' + (r[2] ? ', escreveu no diário' : '') + '">' +
        (r[0] + r[1] + r[2] ? seg(r[2], '--k-diary') + seg(r[1], '--k-habit') + seg(r[0], '--k-task') : '<span class="zero"></span>') + '</button>';
      lbls += '<span>' + ((i + 1) % 7 === 1 ? (i + 1) : '') + '</span>';
    });
    var cols = 'grid-template-columns:repeat(' + n + ',1fr)';
    var html = '<h3 class="sub">Atividades do mês <small>' + (tT + tH + tN) + ' no mês</small></h3>' +
      '<div class="legend"><span><i style="background:var(--k-task)"></i>' + tT + (tT === 1 ? ' tarefa' : ' tarefas') + '</span><span><i style="background:var(--k-habit)"></i>' + tH + (tH === 1 ? ' hábito' : ' hábitos') + '</span><span><i style="background:var(--k-diary)"></i>' + tN + (tN === 1 ? ' dia no diário' : ' dias no diário') + '</span></div>' +
      '<div class="bars" id="bars" style="' + cols + '" role="group" aria-label="Atividades por dia">' + bars + '</div>' +
      '<div class="bar-lbls" style="' + cols + '" aria-hidden="true">' + lbls + '</div>' +
      '<p class="dayread" id="dayRead">Toque numa barra para ver o dia.</p>';

    /* por etiqueta */
    var byCat = {}, catTotal = 0;
    state.tasks.forEach(function (t) { if (t.done && t.doneOn && t.doneOn.indexOf(prefix) === 0) { byCat[t.cat || ''] = (byCat[t.cat || ''] || 0) + 1; catTotal++; } });
    state.series.forEach(function (sr) { Object.keys(sr.done).forEach(function (k) { if (k.indexOf(prefix) === 0) { byCat[sr.cat || ''] = (byCat[sr.cat || ''] || 0) + 1; catTotal++; } }); });
    if (catTotal) {
      var cmax = 0;
      Object.keys(byCat).forEach(function (k) { if (byCat[k] > cmax) cmax = byCat[k]; });
      html += '<h3 class="sub">Tarefas concluídas <small>' + catTotal + ' no mês</small></h3><div class="card catcard">';
      Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).forEach(function (k) {
        var c = catById(k), col = c ? 'var(--c' + c.color + ')' : 'var(--muted)';
        html += '<div class="cb"><span class="cbn"><i style="background:' + col + '"></i>' + esc(c ? c.name : 'Sem etiqueta') + '</span><span class="cbbar"><span style="width:' + Math.round(byCat[k] / cmax * 100) + '%;background:' + col + '"></span></span><b>' + byCat[k] + '</b></div>';
      });
      html += '</div>';
    }

    /* hábitos e metas semanais */
    html += '<h3 class="sub">Hábitos</h3>';
    if (!state.habits.length) html += '<p class="empty">Nenhum hábito ainda.</p>';
    var last = ymd(new Date(y, mo, n));
    state.habits.forEach(function (hb) {
      if (hb.start > last || (hb.end && hb.end < prefix + '01')) return;
      var x = 0, den = 0;
      for (var d = 1; d <= elapsed; d++) { var hk = prefix + pad(d); if (habitActive(hb, hk)) { den++; if (hb.days[hk]) x++; } }
      var pct = den ? Math.round(x / den * 100) : 0;
      var extra, right;
      if (hb.target > 0) {
        var wm = 0, wh = 0;
        for (var w = weekStart(new Date(y, mo, 1)); ymd(w) <= last; w = addDays(w, 7)) {
          var hit = weekCount(hb, w) >= hb.target;
          var ov = ymd(addDays(w, 6)) >= hb.start && (!hb.end || ymd(w) <= hb.end);
          if (ov && (hit || ymd(addDays(w, 6)) <= today)) { wm++; if (hit) wh++; }
        }
        right = x + (x === 1 ? ' dia feito' : ' dias feitos');
        extra = 'Meta de ' + hb.target + (hb.target === 1 ? ' vez' : ' vezes') + ' por semana: batida em ' + wh + ' de ' + wm + (wm === 1 ? ' semana' : ' semanas');
        pct = wm ? Math.round(wh / wm * 100) : 0;
      } else {
        var best = bestStreak(hb);
        right = x + '/' + den + ' dias · ' + pct + '%';
        var cur = streak(hb);
        extra = 'Sequência atual: ' + cur + (cur === 1 ? ' dia' : ' dias') + ' · Melhor: ' + best + (best === 1 ? ' dia' : ' dias');
      }
      html += '<div class="card hrow"><div class="hrow-top"><b>' + esc(hb.name) + '</b><span>' + right + '</span></div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<p class="hint">' + extra + '</p></div>';
    });

    /* humor */
    var mc = [0, 0, 0, 0, 0], mt = 0;
    Object.keys(state.moods).forEach(function (k) { if (k.indexOf(prefix) === 0) { mc[state.moods[k] - 1]++; mt++; } });
    html += '<h3 class="sub">Humor <small>' + mt + (mt === 1 ? ' dia registrado' : ' dias registrados') + '</small></h3><div class="card mood-sum">';
    for (var k = 1; k <= 5; k++) html += '<div style="--mc:var(--m' + k + ')" title="' + MOODS[k - 1] + '">' + face(k) + '<b>' + mc[k - 1] + '</b></div>';
    html += '</div>';

    /* linha do humor no mês */
    var pts = [];
    for (var dd = 1; dd <= n; dd++) { var mv2 = state.moods[prefix + pad(dd)]; if (mv2) pts.push([dd, mv2]); }
    if (pts.length >= 2) {
      var sv = '<svg viewBox="0 0 300 96" role="img" aria-label="Humor ao longo do mês">';
      for (var g = 0; g < 5; g++) sv += '<line x1="8" x2="292" y1="' + (12 + g * 18) + '" y2="' + (12 + g * 18) + '" stroke="var(--line)" stroke-width="1"/>';
      var xy = pts.map(function (q) { return [8 + (q[0] - 1) / Math.max(1, n - 1) * 284, 12 + (5 - q[1]) * 18]; });
      for (var sg = 0; sg < pts.length - 1; sg++) {
        var ma = pts[sg][1], mb = pts[sg + 1][1];
        var scol = (ma === 5 && mb === 5) ? 'var(--k-habit)' : mb > ma ? 'var(--m4)' : mb < ma ? 'var(--m1)' : 'var(--muted)';
        sv += '<line x1="' + xy[sg][0].toFixed(1) + '" y1="' + xy[sg][1] + '" x2="' + xy[sg + 1][0].toFixed(1) + '" y2="' + xy[sg + 1][1] + '" stroke="' + scol + '" stroke-width="2.5" stroke-linecap="round"/>';
      }
      pts.forEach(function (q, i) { sv += '<circle cx="' + xy[i][0].toFixed(1) + '" cy="' + xy[i][1] + '" r="4.5" style="fill:var(--m' + q[1] + ')" stroke="var(--surface)" stroke-width="1.5"/>'; });
      html += '<div class="card moodline">' + sv + '</svg></div>';
    }

    /* humor e hábitos (todos os dias registrados) */
    var mdays = Object.keys(state.moods);
    if (mdays.length >= 10) {
      var avg = function (a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; };
      var fm = function (v) { return v.toFixed(1).replace('.', ','); };
      var rel = [];
      state.habits.forEach(function (hb) {
        var yes = [], no = [];
        mdays.forEach(function (k) { (hb.days[k] ? yes : no).push(state.moods[k]); });
        if (yes.length >= 3 && no.length >= 3) { var ya = avg(yes), na = avg(no); if (Math.abs(ya - na) >= 0.5) rel.push({ n: hb.name, y: ya, o: na }); }
      });
      rel.sort(function (a, b) { return Math.abs(b.y - b.o) - Math.abs(a.y - a.o); });
      if (rel.length) {
        html += '<h3 class="sub">Humor e hábitos <small>' + mdays.length + ' dias registrados</small></h3><div class="card corr">' +
          rel.slice(0, 3).map(function (r) { return '<p>Nos dias em que você fez <b>' + esc(r.n) + '</b>, o humor médio foi ' + fm(r.y) + ' (nos outros, ' + fm(r.o) + ').</p>'; }).join('') +
          '<p class="hint">Isso mostra coincidência entre os dias, não que um cause o outro.</p></div>';
      }
    }
    $('#histBody').innerHTML = html;
  }

  /* ---------- Histórico (tela cheia) ---------- */
  function openHist() {
    histOpen = true;
    renderHistory(ymd(new Date()));
    $('#histView').hidden = false;
    $('#histClose').focus();
  }

    sw.setAttribute('aria-valuenow', pct); sw.setAttribute('aria-label', 'Hábitos em conjunto de hoje');
    $('#ringTx').textContent = pr.done + '/' + pr.total;
    hb.setAttribute('aria-label', 'Estatísticas do casal');
  }
  function whoCard(name, mv, label, col, av) {
    return '<div class="card cp-who"' + (mv ? ' style="--mc:var(--m' + mv + ')"' : '') + '>' + (mv ? face(mv) : '<div class="dash">–</div>') + '<div class="nm">' + avHtml(av, name) + '<b style="color:' + col + '">' + esc(name) + '</b></div><span>' + (mv ? MOODS[mv - 1] : 'ainda não registrou') + '</span></div>';
  }
  function cStatsHtml(c) {
    var td = ymd(new Date()), me = state.settings.name || 'Você', pn = c.pname || 'Seu par', h = '';
      var y = coupleMonth.getFullYear(), mo = coupleMonth.getMonth(), n = new Date(y, mo + 1, 0).getDate(), prefix = y + '-' + pad(mo + 1) + '-';
      var navH = '<div class="hist-nav"><button type="button" class="step" data-act="couple-prev" aria-label="Mês anterior">&lsaquo;</button><span class="hist-title">' + cap(MESES[mo]) + ' ' + y + '</span><button type="button" class="step" data-act="couple-next" aria-label="Próximo mês">&rsaquo;</button></div>';
      function series(map, col) {
        var pts = [];
        for (var d = 1; d <= n; d++) { var k = prefix + pad(d), v = map[k]; if (v && k >= c.since) pts.push([d, v]); }
        return pts;
      }
      var mine = series(state.moods), theirs = series(partner.moods);
      function xy(q) { return [8 + (q[0] - 1) / Math.max(1, n - 1) * 284, 12 + (5 - q[1]) * 18]; }
      var sv = '<svg viewBox="0 0 300 96" role="img" aria-label="Humor do casal ao longo do mês">';
      for (var g = 0; g < 5; g++) sv += '<line x1="8" x2="292" y1="' + (12 + g * 18) + '" y2="' + (12 + g * 18) + '" stroke="var(--line)" stroke-width="1"/>';
      [[mine, 'var(--p-me)'], [theirs, 'var(--p-pt)']].forEach(function (sr) {
        var pts = sr[0];
        if (pts.length >= 2) sv += '<polyline fill="none" stroke="' + sr[1] + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map(function (q) { var p2 = xy(q); return p2[0].toFixed(1) + ',' + p2[1]; }).join(' ') + '"/>';
        pts.forEach(function (q) { var p2 = xy(q); sv += '<circle cx="' + p2[0].toFixed(1) + '" cy="' + p2[1] + '" r="4" fill="' + sr[1] + '" stroke="var(--surface)" stroke-width="1.5"/>'; });
      });
      sv += '</svg>';
      var both = 0, same = 0, good = 0;
      for (var d2 = 1; d2 <= n; d2++) {
        var k2 = prefix + pad(d2), a = state.moods[k2], b2 = partner.moods[k2];
        if (a && b2 && k2 >= c.since) { both++; if (a === b2) same++; if (a >= 4 && b2 >= 4) good++; }
      }
      var chartH = '<div class="card moodline">' + sv + '<div class="cp-leg"><span><i style="background:var(--p-me)"></i>' + esc(me) + '</span><span><i style="background:var(--p-pt)"></i>' + esc(pn) + '</span></div></div>';
      var corrH = '<div class="card corr"><p>Dias em que os dois registraram: <b>' + both + '</b></p><p>Dias com o mesmo humor: <b>' + same + '</b></p><p>Dias em que os dois estiveram bem ou ótimos: <b>' + good + '</b></p></div>';
      return navH + statsBlocks({ sintonia: sinHtml(me, pn, c, prefix, n, y, mo), mood: chartH + corrH, summary: summaryHtml(me, pn, c, prefix, n, y, mo), love: loveStatsHtml(me, pn, c), rate: rateChartHtml(me, pn, c, prefix, n) });
  }
  function renderCouple() {
    var el = $('#coupleBody'), c = state.couple, h = '', conn = coupleConn();
    var priv = '<ul class="cp-priv"><li><b>O que é compartilhado:</b> o seu humor de cada dia e o seu nome, a partir do dia da conexão.</li><li><b>Hábitos em conjunto:</b> os que vocês criarem na aba Hábitos do Nós aparecem para os dois.</li><li><b>O que não é:</b> notas do diário, tarefas e os seus hábitos pessoais continuam só seus.</li><li><b>Segurança:</b> tudo vai criptografado, só vocês dois conseguem ler.</li><li>Você pode desconectar quando quiser.</li></ul>';
    if (!STANDALONE) h = '<div class="card" style="margin-top:14px;padding:16px"><p class="set-note">Esta parte funciona no app instalado, com a conta Google.</p></div>';
    else if (!cloud.user) h = '<div class="card" style="margin-top:14px;padding:16px"><b>Entre com a sua conta</b><p class="set-note" style="margin-top:6px">Para conectar com seu par, primeiro entre com a sua conta Google nos Ajustes.</p><div class="cp-btns"><button type="button" class="btn" data-act="settings-open-from-couple">Abrir Ajustes</button></div></div>';
    else if (!cloud.key) h = '<div class="card" style="margin-top:14px;padding:16px"><b>Falta a senha</b><p class="set-note" style="margin-top:6px">Digite a sua senha de criptografia nos Ajustes para usar esta parte.</p><div class="cp-btns"><button type="button" class="btn" data-act="settings-open-from-couple">Abrir Ajustes</button></div></div>';
    else if (!c) h = '<div class="card" style="margin-top:14px;padding:16px"><b>Compartilhe o humor com quem você ama</b><p class="set-note" style="margin-top:6px">Conecte-se ao seu namorado, namorada, esposo ou esposa e comparem como estão se sentindo ao longo do tempo.</p>' + priv + '<div class="cp-btns"><button type="button" class="btn" data-act="couple-new">Convidar meu par</button><button type="button" class="btn ghost" data-act="couple-enter">Tenho um código</button></div></div>';
    else if (c.mode === 'inviting') {
      var expired = Date.now() > c.exp;
      h = '<div class="card" style="margin-top:14px;padding:16px"><b>' + (expired ? 'Este convite expirou' : 'Envie este código ao seu par') + '</b><p class="set-note" style="margin-top:6px">' + (expired ? 'Gere um novo código para tentar de novo.' : 'No app do seu par, é só tocar no botão do coração, depois em "Tenho um código" e digita este código. Vale por 24 horas e só pode ser usado uma vez.') + '</p>' +
        (expired ? '' : '<div class="cp-code card" style="margin-top:12px">' + esc(fmtCode(c.code)) + '</div>') + '<div class="cp-btns">' +
        (expired ? '<button type="button" class="btn" data-act="couple-renew">Gerar novo código</button>' : '<button type="button" class="btn" data-act="couple-copy">Copiar código</button><button type="button" class="btn ghost" data-act="couple-share">Compartilhar</button>') +
        '<button type="button" class="btn ghost" data-act="couple-cancel">Cancelar convite</button></div>' + (expired ? '' : '<p class="set-note" style="margin-top:12px">Aguardando o seu par entrar com o código…</p>') + '</div>';
    } else if (!c.ok || !c.since) {
      h = '<div class="card" style="margin-top:14px;padding:16px"><b>Conectando…</b><p class="set-note" style="margin-top:6px">Aguardando ' + esc(c.pname || 'o seu par') + ' terminar a conexão.</p><div class="cp-btns"><button type="button" class="btn ghost" data-act="couple-off">Cancelar</button></div></div>';
    } else {
      var td = selKey(), me = state.settings.name || 'Você', pn = c.pname || 'Seu par';
      var heroH = '<h3 class="cp-lab">' + (td === ymd(new Date()) ? 'Humor de hoje' : 'Humor de ' + shortDate(td)) + '</h3><div class="cp-hero">' + whoCard(me, state.moods[td], 'hoje', 'var(--p-me)', state.settings.avatar) + whoCard(pn, partner.moods[td], 'hoje', 'var(--p-pt)', partner.av) + '</div>';
      h += '<div class="cp-line"><span>' + esc(togetherLine(c)) + '</span>' + sinChip(c) + '</div>' + annBanner();
      h += '<div class="cpager" id="cPager"><div class="cpane" id="cPane0">' + shHabitsHtml() + '</div><div class="cpane" id="cPane1">' + heroH + loveCounterHtml(me, pn, c) + rateInputHtml(me, pn, c) + '</div><div class="cpane" id="cPane2">' + juntosHtml(c) + '</div></div>';
    }
    var ps = {}; $$('#cPager .cpane').forEach(function (p) { ps[p.id] = p.scrollTop; });
    var cvs = $('#coupleView'); cvs.classList.toggle('conn', conn);
    el.innerHTML = h;
    $$('#cPager .cpane').forEach(function (p) { if (ps[p.id]) p.scrollTop = ps[p.id]; });
    var sb = $('#cStatsBody');
    if (cStatsOpen) { if (conn) sb.innerHTML = cStatsHtml(c); else closeCStats(); }
    var pgr = $('#cPager'); if (pgr) { pgr.style.scrollSnapType = 'none'; pgr.scrollLeft = coupleTab * pgr.clientWidth; pgr.style.scrollSnapType = ''; }
    $('#cTabs').hidden = !conn; $('#cFabw').hidden = !conn || !coupleOpen || coupleTab !== 0;
    if (conn) {
      if (!cDragging()) $('#cTabs').style.setProperty('--p', String(coupleTab));
      for (var qq = 0; qq < CN; qq++) $('#ctab-' + qq).setAttribute('aria-selected', String(coupleTab === qq));
    }
    runFx();
  }

  /* ---------- Início ---------- */
  var saved = loadLocal();
  localHad = !!saved;
  state = normalize(saved || sampleState());
  lastJson = JSON.stringify(state);
  var t0 = new Date();
  histMonth = new Date(t0.getFullYear(), t0.getMonth(), 1);
  $('#taskChips').innerHTML = chipsHtml([]);
  $('#taskPri').innerHTML = priChips(0);
  setupTabs();
  initCloud();
  setStatus('Seus dados estão salvos neste navegador.');
  render();
  var startTab = 0;
  try { startTab = parseInt(localStorage.getItem(TAB_KEY), 10) || 0; } catch (e) {}
  var qs = null;
  try { qs = new URLSearchParams(location.search); } catch (e) {}
  var qAba = qs && qs.get('aba'), qAcao = qs && qs.get('acao');
  if (qAba === 'habitos') startTab = 1; else if (qAba === 'diario') startTab = 2; else if (qAcao === 'tarefa') startTab = 0;
  if (qAba || qAcao) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  go(Math.min(startTab, 2), true);
  if (qAcao === 'tarefa') setTimeout(function () { openCompose(); }, 350);
  localSave();
  connect();
  setTimeout(maybeWelcome, STANDALONE ? 500 : 2200);

  /* hora virou (21h, nova saudação, novo dia): redesenha sem atrapalhar */
  setInterval(function () {
    if (document.hidden || sheetCtx || histOpen) return;
    var n2 = new Date(), h2 = n2.getHours();
    var per2 = h2 < 5 ? 0 : h2 < 12 ? 1 : h2 < 18 ? 2 : 3;
    if (per2 + '-' + (h2 >= 21 ? 1 : 0) + '-' + ymd(n2) !== lastBucket) render();
  }, 30000);

  /* aviso de versão nova (só no app instalado) */
  function checkUpdate() {
    var m = document.querySelector('meta[name="build"]');
    if (!m || !navigator.onLine) return;
    fetch(new URL('index.html', location.href).href, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var x = /name="build" content="([^"]+)"/.exec(t);
      if (x && x[1] !== m.getAttribute('content')) $('#updBar').hidden = false;
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkUpdate(); });
  setTimeout(checkUpdate, 4000);
})();
</script>
