<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7BA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Painel da Vida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho compacto (saudação, progresso do dia, histórico e quadrado da data), três painéis que deslizam (Tarefas, Hábitos, Diário) feitos de cartões suaves, e a barra de abas embaixo. A cor de destaque muda com a aba ativa. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #14181F;
  --muted: #5B6572;
  --line: #E1E5EB;
  --accent: #1F7A5A;
  --accent-ink: #FFFFFF;
  --soft: #DDEDE4;
  --warm: #9A5F08;
  --paper: #FFFFFF;
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-line: rgba(255, 255, 255, 0.75);
  --glass-hi: rgba(255, 255, 255, 0.95);
  --glass-sheen: rgba(255, 255, 255, 0.55);
  --glass-shadow: rgba(20, 24, 31, 0.18);
  --hd: #0B7BA8; --hd-soft: #D9EDF6; --hd-ink: #FFFFFF;
  --c0: #D6457A; --c1: #D9651B; --c2: #2E9E6B; --c3: #3F6FD0; --c4: #8A4FD0; --c5: #14948F; --c6: #9A7B00; --c7: #6F7F88;
  --m1: #C8372D;
  --m2: #3F6FD0;
  --m3: #6F7F88;
  --m4: #2E9E6B;
  --m5: #D18F00;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
.wrap[data-tab="1"] { --accent: #6B4FB8; --soft: #E9E3F6; }
.wrap[data-tab="2"] { --accent: #B5600A; --soft: #F8E9D8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1318; --surface: #181D24; --ink: #E8ECF1; --muted: #9AA5B1; --line: #272E38;
    --accent: #54C79B; --accent-ink: #08140F; --soft: #1B2B25; --warm: #E6A23C;
    --hd: #5CC8F0; --hd-soft: #16303B; --hd-ink: #04141C; --c0: #F07AA3; --c1: #F29A58; --c2: #4FC594; --c3: #7FA2F0; --c4: #B896F0; --c5: #4FD0C8; --c6: #E6C24A; --c7: #A3B0B8;
    --m1: #F0716A; --m2: #7FA2F0; --m3: #A3B0B8; --m4: #4FC594; --m5: #F0BC3A;
  --glass-bg: rgba(40, 48, 60, 0.5); --glass-line: rgba(255, 255, 255, 0.16); --glass-hi: rgba(255, 255, 255, 0.25); --glass-sheen: rgba(255, 255, 255, 0.14); --glass-shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .wrap[data-tab="1"] { --accent: #B49CF0; --accent-ink: #140C2A; --soft: #2A2342; }
  :root:not([data-theme="light"]) .wrap[data-tab="2"] { --accent: #F0A04B; --accent-ink: #2A1604; --soft: #3A2A19; }
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #181D24; --ink: #E8ECF1; --muted: #9AA5B1; --line: #272E38;
  --accent: #54C79B; --accent-ink: #08140F; --soft: #1B2B25; --warm: #E6A23C;
  --hd: #5CC8F0; --hd-soft: #16303B; --hd-ink: #04141C; --c0: #F07AA3; --c1: #F29A58; --c2: #4FC594; --c3: #7FA2F0; --c4: #B896F0; --c5: #4FD0C8; --c6: #E6C24A; --c7: #A3B0B8;
  --m1: #F0716A; --m2: #7FA2F0; --m3: #A3B0B8; --m4: #4FC594; --m5: #F0BC3A;
  --glass-bg: rgba(40, 48, 60, 0.5); --glass-line: rgba(255, 255, 255, 0.16); --glass-hi: rgba(255, 255, 255, 0.25); --glass-sheen: rgba(255, 255, 255, 0.14); --glass-shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
:root[data-theme="dark"] .wrap[data-tab="1"] { --accent: #B49CF0; --accent-ink: #140C2A; --soft: #2A2342; }
:root[data-theme="dark"] .wrap[data-tab="2"] { --accent: #F0A04B; --accent-ink: #2A1604; --soft: #3A2A19; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  padding-block: 18px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
header { flex: none; position: relative; --accent: var(--hd); --soft: var(--hd-soft); --accent-ink: var(--hd-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* Cabeçalho */
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(21px, 5.6vw, 34px); line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; min-width: 0; }
.head-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--ink); }
.icon-btn:hover { background: var(--soft); }
.tile { width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 0; overflow: hidden; display: flex; flex-direction: column; align-items: stretch; text-align: center; }
.tile-top { background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 0; }
.tile-num { flex: 1; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; }
.tile.other { box-shadow: 0 0 0 2px var(--accent); }
.tile[aria-expanded="true"] { border-color: var(--accent); }
.day { margin-top: 14px; }
.bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.35s ease; }
.day-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-top: 8px; min-height: 28px; font-size: 14px; color: var(--muted); }
.day-meta p { margin: 0; }
.pill-btn { background: var(--soft); color: var(--accent); border: 0; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.sample { margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: var(--soft); display: flex; gap: 8px 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; flex: none; }
.sample p { margin: 0; flex: 1 1 200px; min-width: 0; }

/* Calendário */
.cal { position: absolute; right: 0; top: 74px; z-index: 30; width: min(340px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22); }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-title { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 12px; text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 6px; }
.cal-day { background: none; border: 0; padding: 3px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); min-width: 0; }
.cal-day .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; border: 2px solid transparent; }
.cal-day:hover .num:not(.mood) { background: var(--soft); }
.cal-day .num.mood { border-color: var(--mc); background: var(--surface); background: color-mix(in srgb, var(--mc) 24%, var(--surface)); }
.cal-day.other { color: var(--muted); opacity: 0.55; }
.cal-day.today .num { font-weight: 800; }
.cal-day.today .num:not(.mood) { color: var(--accent); }
.cal-day.sel .num { outline: 2px solid var(--ink); outline-offset: 2px; }
.tdot { width: 8px; height: 8px; border-radius: 50%; display: block; }
.tdot.pend { background: var(--paper); border: 1.5px solid var(--muted); }
.tdot.ok { background: var(--m4); }
.tdot.none { visibility: hidden; }
.cal-foot { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cal-legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }

/* Painéis que deslizam */
.pager { flex: 1; min-height: 0; margin: 14px calc(-1 * var(--gr)) 0 calc(-1 * var(--gl)); display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.pager::-webkit-scrollbar { display: none; }
.panel { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; padding: 2px var(--gr) 128px var(--gl); }

/* Barra flutuante em vidro */
.tabs { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: min(360px, calc(100% - 32px)); z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; border-radius: 999px;
  background: var(--surface); background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
  border: 1px solid var(--glass-line);
  box-shadow: 0 12px 32px var(--glass-shadow), inset 0 1px 1px var(--glass-hi), inset 0 -1px 1px var(--glass-line), inset 0 0 14px var(--glass-sheen); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .tabs { background: var(--surface); } }
.tabs::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(165deg, var(--glass-sheen), transparent 42%); }
.glass-ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: 999px; translate: calc(var(--p, 0) * 100%) 0; will-change: translate, scale; pointer-events: none; touch-action: none;
  transition: scale 0.5s cubic-bezier(0.3, 1.6, 0.5, 1), background-color 0.25s, box-shadow 0.25s;
  background: var(--soft); background: color-mix(in srgb, var(--accent) 20%, transparent);
  -webkit-backdrop-filter: blur(6px) saturate(1.6); backdrop-filter: blur(6px) saturate(1.6);
  box-shadow: inset 0 1px 1px var(--glass-hi), inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent); }
.tab { position: relative; z-index: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 7px 0 6px; font-size: 11px; font-weight: 700; color: var(--muted); min-width: 0; border-radius: 999px; }
.tab .pill { display: grid; place-items: center; }
.tab[aria-selected="true"] { color: var(--accent); }

/* Cartões e formulários */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.add { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.add-line { display: flex; gap: 8px; }
.add-line input[type="text"] { flex: 1; min-width: 0; }
input[type="text"], input[type="time"], input[type="date"], input[type="number"], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-width: 100%;
}
textarea { width: 100%; resize: vertical; min-height: 92px; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.9; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.btn.wide { align-self: flex-start; }

.more summary { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; width: fit-content; padding: 2px 0; }
.more-body { display: flex; flex-wrap: wrap; gap: 10px 14px; padding: 10px 0 2px; align-items: flex-end; }
.fld { display: flex; flex-direction: column; gap: 4px; margin: 0 0 14px; font-size: 14px; color: var(--muted); }
.fld > span { font-weight: 700; }
.more-body .fld, .add .fld { margin: 0; }
.fld.inline .inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.add .fld.inline { flex-direction: row; align-items: center; gap: 12px; }
.add .fld.inline select { flex: 1; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 100%; margin: 0 0 14px; }
.more-body .chips { margin: 0; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 12px; margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.row.is-done { opacity: 0.62; }
.check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; color: transparent; padding: 0; transition: background 0.15s, transform 0.15s; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check:active { transform: scale(0.9); }
.txt-btn { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 0; text-align: left; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; overflow-wrap: anywhere; }
.txt-btn.done .txt-main { text-decoration: line-through; text-decoration-thickness: 1px; }
.time { background: var(--soft); color: var(--accent); border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 700; }
.rep { display: inline-flex; color: var(--muted); }
.tag { background: var(--soft); color: var(--warm); border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.x { flex: none; width: 34px; height: 34px; border: 0; background: none; color: var(--muted); border-radius: 50%; display: grid; place-items: center; padding: 0; }
.x:hover { color: var(--ink); background: var(--soft); }
.empty { color: var(--muted); font-size: 15px; padding: 22px 8px; margin: 0; text-align: center; }

/* Hábitos */
.week-cap { margin: 16px 2px 0; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.weekhead, .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; justify-items: center; }
.weekhead { margin: 8px 16px 0; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.weekhead .hoje { color: var(--accent); }
.habit { margin-top: 8px; padding: 12px 14px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.habit-top { display: flex; align-items: center; gap: 8px; }
.habit-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; background: none; border: 0; padding: 2px 0; text-align: left; }
.habit-sub { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
.habit-sub b { color: var(--ink); font-weight: 700; }
.habit-sub .hit { color: var(--accent); font-weight: 700; }
.streak { color: var(--warm); font-weight: 700; }
.dot { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; color: transparent; padding: 0; }
.dot.today { border-color: var(--accent); }
.dot.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.dot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot:disabled { opacity: 0.35; cursor: default; }
.step { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; display: grid; place-items: center; padding: 0; flex: none; }
.step:hover { border-color: var(--accent); }

/* Diário */
.label { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--muted); }
.mood-card { padding: 14px; }
.faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.face-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--bg); border: 2px solid transparent; border-radius: 16px; padding: 10px 2px 8px; color: var(--mc); font-size: 12px; font-weight: 700; }
.face-btn .fi { width: 100%; max-width: 44px; aspect-ratio: 1; }
.face-btn span.nm { color: var(--ink); }
.face-btn[aria-checked="true"] { border-color: var(--mc); background: var(--surface); background: color-mix(in srgb, var(--mc) 16%, var(--surface)); }
.mood-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.notes-add { margin-top: 12px; }
.nrow { margin-top: 8px; padding: 12px 6px 12px 14px; display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.nbody { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.nmeta { font-size: 12px; font-weight: 700; color: var(--accent); display: block; margin-bottom: 4px; }
.ntext { white-space: pre-wrap; overflow-wrap: anywhere; display: block; }

/* Histórico (tela cheia) */
.hist-view { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.hist-inner { max-width: 720px; margin: 0 auto; }
.hist-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: -0.02em; margin: 0; }
.hist-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
.hist-title { font-family: var(--f-display); font-weight: 700; font-size: 19px; }
h3.sub { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h3.sub small { font-family: var(--f-body); font-size: 13px; font-weight: 600; color: var(--muted); }
.bars { display: grid; gap: 2px; align-items: end; height: 76px; border-bottom: 1px solid var(--line); }
.bar-col { display: flex; align-items: flex-end; height: 100%; }
.bar-col span { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }
.bar-col span.zero { background: var(--line); height: 2px; border-radius: 0; }
.bar-lbls { display: grid; gap: 2px; margin-top: 4px; font-size: 10px; color: var(--muted); }
.bar-lbls span { white-space: nowrap; }
.hrow { padding: 12px 14px; margin-top: 8px; }
.hrow-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 8px; }
.hrow-top b { font-weight: 700; overflow-wrap: anywhere; }
.hrow-top span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.hrow .hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.mood-sum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px 10px; }
.mood-sum div { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--mc); }
.mood-sum .fi { width: 100%; max-width: 36px; aspect-ratio: 1; }
.mood-sum b { font-size: 15px; color: var(--ink); font-weight: 700; }
.status { margin: 28px 0 0; font-size: 13px; color: var(--muted); text-align: center; }

/* Painel de baixo (editar e escolher) */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-back[hidden], #histView[hidden], .cal[hidden], #cal[hidden] { display: none !important; }
.sheet-panel { width: min(520px, 100%); max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }

.sheet-panel .inline input[type="time"] { width: auto; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.sheet-actions.col { flex-direction: column; }
.sheet-actions.col .btn { width: 100%; }

#toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-width: 420px; margin: 0 auto; z-index: 70; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }

@media (prefers-reduced-motion: reduce) { .bar > span, .check, .glass-ind { transition: none !important; } }
.tabs { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tabs.live .glass-ind { transition: background-color 0.25s, box-shadow 0.25s; }
.tabs.held .glass-ind { background: color-mix(in srgb, var(--accent) 34%, transparent); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 32%, transparent), inset 0 1.5px 1px var(--glass-hi), inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }

/* Vidro líquido (leve): fundo em gradientes estáticos, superfícies translúcidas; desfoque real só nas camadas por cima */
.aura { position: fixed; inset: 0; z-index: -1; pointer-events: none; contain: strict; }
.aura i { position: absolute; border-radius: 50%; }
.aura i:nth-child(1) { width: 520px; height: 520px; left: -200px; top: -190px; background: radial-gradient(circle closest-side, color-mix(in srgb, var(--accent) 42%, transparent), transparent); }
.aura i:nth-child(2) { width: 480px; height: 480px; right: -230px; top: 30%; background: radial-gradient(circle closest-side, color-mix(in srgb, color-mix(in srgb, var(--accent) 45%, var(--m2)) 38%, transparent), transparent); }
.aura i:nth-child(3) { width: 460px; height: 460px; left: 0; bottom: -220px; background: radial-gradient(circle closest-side, color-mix(in srgb, color-mix(in srgb, var(--accent) 40%, var(--m5)) 36%, transparent), transparent); }

.card, .habit, .tile, .icon-btn, .sample, .face-btn, .step, .row, .nrow, .bar {
  background: var(--surface);
  border-color: var(--glass-line);

}
@supports (background: color-mix(in srgb, red 50%, transparent)) {

.card, .habit, .row, .nrow, .tile, .icon-btn, .face-btn { position: relative; }

.icon-btn:hover, .face-btn:hover { background: color-mix(in srgb, var(--soft) 70%, transparent); }
.face-btn[aria-checked="true"] { background: color-mix(in srgb, var(--mc) 20%, transparent); box-shadow: inset 0 1px 1px var(--glass-hi); }
.dot, .check { background: color-mix(in srgb, var(--surface) 50%, transparent); }

.sheet-panel { border: 1px solid var(--glass-line); border-bottom: 0; }

.panel { contain: layout style; }

/* Cabeçalho com cor fixa e quadrado da data em vidro */
header .tile, header .icon-btn { position: relative; background: linear-gradient(155deg, color-mix(in srgb, var(--surface) 70%, transparent), color-mix(in srgb, var(--accent) 16%, transparent)); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(12px) saturate(1.6); backdrop-filter: blur(12px) saturate(1.6); box-shadow: 0 8px 22px var(--glass-shadow), inset 0 1.5px 1px var(--glass-hi), inset 0 -2px 6px color-mix(in srgb, var(--accent) 18%, transparent), inset 0 0 14px var(--glass-sheen); }
header .tile { width: 66px; height: 66px; border-radius: 21px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; overflow: hidden; }
header .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(165deg, var(--glass-sheen), transparent 45%); }
header .tile .tile-top { background: none; color: var(--accent); padding: 0; width: 100%; display: block; font-size: 10px; font-weight: 800; line-height: 1; letter-spacing: 0.08em; text-indent: 0.08em; text-align: center; text-transform: uppercase; white-space: nowrap; }

/* Etiquetas e prioridade */
.fld.full { flex: 1 1 100%; }
.chips[hidden] { display: none; }
.filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.filter .chip, .chips .chip { padding: 5px 11px; font-size: 13px; }
.chip[data-cat] { display: inline-flex; align-items: center; gap: 6px; }

.row[data-p="3"] { border-left: 3px solid var(--m1); } .row[data-p="2"] { border-left: 3px solid var(--m5); } .row[data-p="1"] { border-left: 3px solid var(--m2); }

/* Saudação: texto no turquesa do topo e ícone de vidro que muda por horário */

.hello-tx { color: var(--accent); background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--ink))); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; min-width: 0; }
.hello-ic { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--pc, var(--accent)); position: relative; overflow: hidden;
  background: linear-gradient(155deg, color-mix(in srgb, var(--surface) 70%, transparent), color-mix(in srgb, var(--pc, var(--accent)) 20%, transparent));
  border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(12px) saturate(1.6); backdrop-filter: blur(12px) saturate(1.6);
  box-shadow: 0 6px 18px var(--glass-shadow), inset 0 1.5px 1px var(--glass-hi), inset 0 -2px 6px color-mix(in srgb, var(--pc, var(--accent)) 22%, transparent); }
.hello-ic::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(165deg, var(--glass-sheen), transparent 45%); }
.hello-ic[data-p="0"] { --pc: #5B52C8; } .hello-ic[data-p="1"] { --pc: #C98A00; } .hello-ic[data-p="2"] { --pc: #D9651B; } .hello-ic[data-p="3"] { --pc: #8A4FD0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hello-ic[data-p="0"] { --pc: #8C94F5; } :root:not([data-theme="light"]) .hello-ic[data-p="1"] { --pc: #F0BC3A; } :root:not([data-theme="light"]) .hello-ic[data-p="2"] { --pc: #F29A58; } :root:not([data-theme="light"]) .hello-ic[data-p="3"] { --pc: #B896F0; } }
:root[data-theme="dark"] .hello-ic[data-p="0"] { --pc: #8C94F5; } :root[data-theme="dark"] .hello-ic[data-p="1"] { --pc: #F0BC3A; } :root[data-theme="dark"] .hello-ic[data-p="2"] { --pc: #F29A58; } :root[data-theme="dark"] .hello-ic[data-p="3"] { --pc: #B896F0; }

/* Jeito de app: sem destaque azul de site, sem seleção de texto nos botões, sem puxar-para-atualizar, e reação ao toque */
html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; }
.ntext { -webkit-user-select: text; user-select: text; }
.panel, .hist-view, .sheet-panel { overscroll-behavior-y: contain; }
button, .row, .nrow { transition: transform 0.16s cubic-bezier(0.3, 1.5, 0.5, 1), filter 0.12s, background-color 0.15s; }
button:active:not(:disabled) { transform: scale(0.95); filter: brightness(0.94); }
.row:active, .nrow:active { transform: scale(0.985); }
.row:active .txt-btn, .nrow:active .nbody, .habit-top .habit-name:active, .txt-btn:active, .nbody:active, .habit-name:active { transform: none; filter: none; }
.btn:active { transform: scale(0.96); filter: brightness(0.9); }
.tab:active { transform: scale(0.9); filter: none; }
.dot:active:not(:disabled), .check:active { transform: scale(0.86); }
.cal-day:active { transform: scale(0.9); }
.face-btn:active { transform: scale(0.92); }
</style>
<style>
.backup { margin: 20px 0 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.backup .btn { padding: 9px 14px; font-size: 14px; }
</style>

<body>


<main class="wrap" data-tab="0">
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
  <header>
    <div class="head-row">
      <h1><span class="hello-ic" id="helloIc" aria-hidden="true"></span><span class="hello-tx" id="greeting">Olá</span></h1>
      <div class="head-actions">
        <button type="button" class="icon-btn" id="histOpenBtn" data-act="hist-open" aria-label="Abrir histórico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 20v-8M10 20V5M15 20v-6M20 20V9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="tile" id="dateTile" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal" aria-label="Escolher data">
          <span class="tile-top" id="tileMonth"></span>
          <span class="tile-num" id="tileDay"></span>
        </button>
      </div>
    </div>
    <div class="day">
      <div class="bar" role="progressbar" aria-label="Progresso do dia" aria-valuemin="0" aria-valuemax="100" id="bar"><span id="barFill"></span></div>
      <div class="day-meta"><p id="dayText"></p><button type="button" class="pill-btn" id="backToday" data-act="cal-today" hidden>Voltar para hoje</button></div>
    </div>
    <div class="cal" id="cal" role="dialog" aria-label="Calendário" hidden></div>
  </header>

  <div class="sample" id="sampleNote" hidden>
    <p>Estes são dados de exemplo. Marque, edite ou apague à vontade.</p>
    <button class="link-btn" type="button" data-act="clear-sample">Limpar exemplos</button>
  </div>

  <div class="pager" id="pager">
    <section class="panel" id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks">
      <form class="add card" id="taskForm" autocomplete="off">
        <div class="add-line">
          <input type="text" id="taskInput" placeholder="Nova tarefa" aria-label="Nova tarefa" maxlength="140">
          <button class="btn" type="submit">Adicionar</button>
        </div>
        <details class="more" id="taskMore">
          <summary>Mais opções</summary>
          <div class="more-body">
            <div class="fld full"><span>Etiqueta</span><div class="chips" id="taskCats"></div></div>
            <div class="fld full"><span>Prioridade</span><div class="chips" id="taskPri"></div></div>
            <label class="fld"><span>Hora (opcional)</span><input type="time" id="taskTime"></label>
            <label class="fld"><span>Repetir</span>
              <select id="taskRepeat">
                <option value="none">Não repetir</option>
                <option value="daily">Todo dia</option>
                <option value="weekdays">Dias úteis (seg a sex)</option>
                <option value="weekly">Toda semana</option>
                <option value="monthly">Todo mês</option>
                <option value="custom">Escolher dias da semana</option>
              </select>
            </label>
            <div class="chips" id="taskChips" hidden></div>
          </div>
        </details>
      </form>
      <div class="filter" id="catFilter"></div>
      <ul id="taskList"></ul>
    </section>

    <section class="panel" id="panel-habits" role="tabpanel" aria-labelledby="tab-habits">
      <form class="add card" id="habitForm" autocomplete="off">
        <div class="add-line">
          <input type="text" id="habitInput" placeholder="Novo hábito" aria-label="Novo hábito" maxlength="60">
          <button class="btn" type="submit">Adicionar</button>
        </div>
        <label class="fld inline"><span>Meta</span>
          <select id="habitTarget" aria-label="Meta por semana">
            <option value="0">Todo dia</option>
            <option value="1">1 vez por semana</option>
            <option value="2">2 vezes por semana</option>
            <option value="3">3 vezes por semana</option>
            <option value="4">4 vezes por semana</option>
            <option value="5">5 vezes por semana</option>
            <option value="6">6 vezes por semana</option>
          </select>
        </label>
      </form>
      <p class="week-cap" id="weekCaption"></p>
      <div class="weekhead" id="weekHead" aria-hidden="true"></div>
      <div id="habitList"></div>
    </section>

    <section class="panel" id="panel-diary" role="tabpanel" aria-labelledby="tab-diary">
      <div class="card mood-card">
        <p class="label">Como foi o dia?</p>
        <div class="faces" id="faces" role="radiogroup" aria-label="Humor do dia"></div>
        <p class="mood-note" id="moodNote"></p>
      </div>
      <form class="add card notes-add" id="noteForm" autocomplete="off">
        <textarea id="noteInput" placeholder="Escreva sobre o seu dia, ou o que quiser" aria-label="Nova nota" maxlength="4000"></textarea>
        <button class="btn wide" type="submit">Salvar nota</button>
      </form>
      <div id="noteList"></div>
    </section>
  </div>

  <nav class="tabs" role="tablist" aria-label="Seções do painel">
    <span class="glass-ind" aria-hidden="true"></span>
    <button type="button" class="tab" role="tab" id="tab-tasks" aria-controls="panel-tasks" aria-selected="true">
      <span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5l1.8 1.8L9 5M4 12.5l1.8 1.8L9 11M4 18.5l1.8 1.8L9 17M12 7h8M12 13h8M12 19h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Tarefas
    </button>
    <button type="button" class="tab" role="tab" id="tab-habits" aria-controls="panel-habits" aria-selected="false" tabindex="-1">
      <span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M8 3v4M16 3v4M8.5 15l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Hábitos
    </button>
    <button type="button" class="tab" role="tab" id="tab-diary" aria-controls="panel-diary" aria-selected="false" tabindex="-1">
      <span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4h11a1 1 0 0 1 1 1v14H7a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 18a1 1 0 0 1 1-1h11M10 9h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      Diário
    </button>
  </nav>

  <div class="hist-view" id="histView" role="dialog" aria-modal="true" aria-labelledby="histHead" hidden>
    <div class="hist-inner">
      <div class="hist-top">
        <h2 id="histHead">Histórico</h2>
        <button type="button" class="icon-btn" id="histClose" data-act="hist-close" aria-label="Fechar histórico">
          <svg width="18" height="18" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="hist-nav">
        <button type="button" class="step" data-act="hist-prev" aria-label="Mês anterior">&lsaquo;</button>
        <span class="hist-title" id="histTitle"></span>
        <button type="button" class="step" data-act="hist-next" aria-label="Próximo mês">&rsaquo;</button>
      </div>
      <div id="histBody"></div>
      <p class="status" id="status"></p>
      <div class="backup"><button type="button" class="btn ghost" id="bkExport">Exportar backup</button><button type="button" class="btn ghost" id="bkImport">Importar backup</button><input type="file" id="bkFile" accept="application/json,.json" hidden></div>
    </div>
  </div>

  <div class="sheet-back" id="sheet" hidden>
    <div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>
</main>

<div id="toast" role="status" hidden>
  <span id="toastText"></span>
  <button class="link-btn" type="button" id="toastUndo">Desfazer</button>
</div>

<script>

  var MOODS = ['Bravo', 'Triste', 'Normal', 'Bem', 'Ótimo'];
  var CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var XICON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var REPEAT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11V9a3 3 0 0 1 3-3h11l-3-3M20 13v2a3 3 0 0 1-3 3H6l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function weekStart(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));

    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));

    $('#backToday').hidden = sk === today;
    $('#taskInput').placeholder = sk === today ? 'Nova tarefa' : 'Nova tarefa para ' + shortDate(sk);
    if (calOpen) renderCal();

    /* progresso do dia escolhido */
    var pr = dayProgress(sk, today);
    var pct = pr.total ? Math.round(pr.done / pr.total * 100) : 0;
    $('#barFill').style.width = pct + '%';
    $('#bar').setAttribute('aria-valuenow', pct);
    $('#dayText').textContent = pr.total ? (sk === today ? 'Hoje' : cap(longDate(sk))) + ': ' + pr.done + ' de ' + pr.total + ' concluídos' : (sk === today ? 'Adicione tarefas e hábitos para começar.' : cap(longDate(sk)) + ': nada planejado.');

    /* tarefas */
    var items = itemsFor(sk, today);
    if (catFilter && !catById(catFilter)) catFilter = '';
    var fh2 = '';
    if ((state.cats || []).length) {
      fh2 = '<button type="button" class="chip" data-act="cat-filter" data-cat="" aria-pressed="' + (!catFilter) + '">Todas</button>' + state.cats.map(function (c) {
        return '<button type="button" class="chip" data-act="cat-filter" data-cat="' + esc(c.id) + '" style="--cc:var(--c' + c.color + ')" aria-pressed="' + (c.id === catFilter) + '">' + esc(c.name) + '</button>';
      }).join('');
    }
    fh2 += '<button type="button" class="chip ghostchip" data-act="cat-manage">' + ((state.cats || []).length ? 'Editar' : '+ Etiqueta') + '</button>';
    $('#catFilter').innerHTML = fh2;
    renderFormCats();
    var shown = catFilter ? items.filter(function (it) { return it.cat === catFilter; }) : items;
    $('#taskList').innerHTML = shown.length ? shown.map(function (it) { return rowHtml(it, today, sk); }).join('')
      : '<li class="empty">' + (catFilter ? 'Nada com esta etiqueta neste dia.' : sk === today ? 'Nenhuma tarefa por enquanto. Adicione a primeira acima.' : 'Nada planejado para este dia. Adicione uma tarefa acima.') + '</li>';

    /* hábitos (semana do dia escolhido) */
    var ws = weekStart(sd);
    var we = addDays(ws, 6);
    $('#weekCaption').textContent = 'Semana ' + isoWeek(ws) + ' · ' + ws.getDate() + (ws.getMonth() !== we.getMonth() ? ' ' + MESES_C[ws.getMonth()] : '') + ' a ' + we.getDate() + ' ' + MESES_C[we.getMonth()];
    var wh = '';
    for (var i = 0; i < 7; i++) {
      var d0 = addDays(ws, i);
      wh += '<span class="' + (ymd(d0) === today ? 'hoje' : '') + '">' + DIAS[d0.getDay()] + '</span>';
    }
    $('#weekHead').innerHTML = wh;
    $('#weekHead').style.display = state.habits.length ? '' : 'none';
    $('#habitList').innerHTML = state.habits.length ? state.habits.map(function (hb) {
      var n = 0, dots = '';
      for (var i = 0; i < 7; i++) {
        var dd = addDays(ws, i), key = ymd(dd), on = !!hb.days[key], future = key > today;
        if (on) n++;
        dots += '<button type="button" class="dot' + (key === today ? ' today' : '') + (key === sk ? ' sel' : '') + '" aria-pressed="' + on + '" aria-label="' + esc(hb.name) + ', ' + DIAS[dd.getDay()] + ' ' + dd.getDate() + '"' + (future ? ' disabled' : '') + ' data-act="habit-toggle" data-id="' + esc(hb.id) + '" data-day="' + key + '">' + CHECK + '</button>';
      }
      var sub;
      if (hb.target > 0) {
        var hit = n >= hb.target;
        sub = '<span>' + hb.target + (hb.target === 1 ? ' vez' : ' vezes') + ' por semana</span><span class="' + (hit ? 'hit' : '') + '"><b>' + n + '</b> de ' + hb.target + (hit ? ' · meta batida' : '') + '</span>';
      } else {
        var s = streak(hb);
        sub = '<span>Todo dia</span><span><b>' + n + '</b>/7</span>' + (s >= 2 ? '<span class="streak">' + s + ' dias seguidos</span>' : '');
      }
      return '<div class="habit"><div class="habit-top"><button type="button" class="habit-name" data-act="habit-edit" data-id="' + esc(hb.id) + '" aria-label="Editar hábito: ' + esc(hb.name) + '">' + esc(hb.name) + '</button>' +
        '<button type="button" class="x" aria-label="Remover hábito: ' + esc(hb.name) + '" data-act="habit-del" data-id="' + esc(hb.id) + '">' + XICON + '</button></div>' +
        '<div class="habit-sub">' + sub + '</div>' +
        '<div class="week">' + dots + '</div></div>';
    }).join('') : '<p class="empty">Adicione um hábito para acompanhar a semana.</p>';

    /* diário: humor e notas */
    var mv = state.moods[sk] || 0;
    var fh = '';
    for (var m = 1; m <= 5; m++) {
      fh += '<button type="button" class="face-btn" role="radio" aria-checked="' + (mv === m) + '" style="--mc:var(--m' + m + ')" data-act="mood-set" data-v="' + m + '" aria-label="' + MOODS[m - 1] + '">' + face(m) + '<span class="nm">' + MOODS[m - 1] + '</span></button>';
    }
    $('#faces').innerHTML = fh;
    $('#moodNote').textContent = mv ? 'Humor registrado: ' + MOODS[mv - 1] + '. Toque de novo para limpar.' : 'Toque numa carinha para registrar o dia.';
    var notes = state.notes.filter(function (n) { return n.date === sk; }).sort(function (a, b) { return b.created - a.created; });
    $('#noteList').innerHTML = notes.length ? notes.map(function (n) {
      return '<div class="nrow"><button type="button" class="nbody" data-act="note-edit" data-id="' + esc(n.id) + '" aria-label="Editar nota das ' + hhmm(n.created) + '"><span class="nmeta">' + hhmm(n.created) + '</span><span class="ntext">' + esc(n.text) + '</span></button>' +
        '<button type="button" class="x" aria-label="Remover nota" data-act="note-del" data-id="' + esc(n.id) + '">' + XICON + '</button></div>';
    }).join('') : '<p class="empty">Nenhuma nota neste dia.</p>';

    renderHistory(today);
  }

  function renderHistory(today) {
    var m = histMonth;
    var y = m.getFullYear(), mo = m.getMonth();
    var n = new Date(y, mo + 1, 0).getDate();
    var prefix = y + '-' + pad(mo + 1) + '-';
    $('#histTitle').textContent = cap(MESES[mo]) + ' ' + y;
    var tdy = parseKey(today);
    var elapsed = (tdy.getFullYear() === y && tdy.getMonth() === mo) ? tdy.getDate() : ((y < tdy.getFullYear() || (y === tdy.getFullYear() && mo < tdy.getMonth())) ? n : 0);

    /* tarefas concluídas por dia */
    var dbd = doneByDate(), counts = [], max = 0, total = 0, bars = '', lbls = '';
    for (var d = 1; d <= n; d++) { var c = dbd[prefix + pad(d)] || 0; counts.push(c); total += c; if (c > max) max = c; }
    counts.forEach(function (c, i) {
      bars += '<div class="bar-col" title="' + (i + 1) + ': ' + c + '"><span class="' + (c ? '' : 'zero') + '"' + (c ? ' style="height:' + Math.max(10, Math.round(c / max * 100)) + '%"' : '') + '></span></div>';
      lbls += '<span>' + ((i + 1) % 7 === 1 ? (i + 1) : '') + '</span>';
    });
    var cols = 'grid-template-columns:repeat(' + n + ',1fr)';
    var html = '<h3 class="sub">Tarefas concluídas <small>' + total + ' no mês</small></h3>' +
      '<div class="bars" style="' + cols + '" role="img" aria-label="Tarefas concluídas por dia. Total no mês: ' + total + '">' + bars + '</div>' +
      '<div class="bar-lbls" style="' + cols + '" aria-hidden="true">' + lbls + '</div>';

    /* hábitos e metas semanais */
    html += '<h3 class="sub">Hábitos</h3>';
    if (!state.habits.length) html += '<p class="empty">Nenhum hábito ainda.</p>';
    var last = ymd(new Date(y, mo, n));
    state.habits.forEach(function (hb) {
      var x = 0;
      for (var d = 1; d <= elapsed; d++) if (hb.days[prefix + pad(d)]) x++;
      var pct = elapsed ? Math.round(x / elapsed * 100) : 0;
      var extra, right;
      if (hb.target > 0) {
        var wm = 0, wh = 0;
        for (var w = weekStart(new Date(y, mo, 1)); ymd(w) <= last; w = addDays(w, 7)) {
          var hit = weekCount(hb, w) >= hb.target;
          if (hit || ymd(addDays(w, 6)) <= today) { wm++; if (hit) wh++; }
        }
        right = x + (x === 1 ? ' dia feito' : ' dias feitos');
        extra = 'Meta de ' + hb.target + (hb.target === 1 ? ' vez' : ' vezes') + ' por semana: batida em ' + wh + ' de ' + wm + (wm === 1 ? ' semana' : ' semanas');
        pct = wm ? Math.round(wh / wm * 100) : 0;
      } else {
        var best = bestStreak(hb);
        right = x + '/' + elapsed + ' dias · ' + pct + '%';
        extra = 'Melhor sequência: ' + best + (best === 1 ? ' dia' : ' dias');
      }
      html += '<div class="card hrow"><div class="hrow-top"><b>' + esc(hb.name) + '</b><span>' + right + '</span></div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<p class="hint">' + extra + '</p></div>';
    });

    /* humor */
    var mc = [0, 0, 0, 0, 0], mt = 0;
    Object.keys(state.moods).forEach(function (k) { if (k.indexOf(prefix) === 0) { mc[state.moods[k] - 1]++; mt++; } });
    html += '<h3 class="sub">Humor <small>' + mt + (mt === 1 ? ' dia registrado' : ' dias registrados') + '</small></h3><div class="card mood-sum">';
    for (var k = 1; k <= 5; k++) html += '<div style="--mc:var(--m' + k + ')" title="' + MOODS[k - 1] + '">' + face(k) + '<b>' + mc[k - 1] + '</b></div>';
    html += '</div>';
    $('#histBody').innerHTML = html;
  }

  /* ---------- Histórico (tela cheia) ---------- */
  function openHist() {
    histOpen = true;
    $('#histView').hidden = false;
    $('#histClose').focus();
  }
  function closeHist() {
    if (!histOpen) return;
    histOpen = false;
    $('#histView').hidden = true;
    $('#histOpenBtn').focus();
  }

  /* ---------- Painel de baixo ---------- */
  function openSheet(ctx, html) {
    sheetCtx = ctx;
    $('#sheetPanel').innerHTML = html;
    $('#sheet').hidden = false;
    var f = $('#sheetPanel input[type="text"], #sheetPanel textarea, #sheetPanel .btn');
    if (f) f.focus();
  }
  function closeSheet() {
    sheetCtx = null;
    $('#sheet').hidden = true;
    $('#sheetPanel').innerHTML = '';
  }
  function actionsHtml() {
    return '<div class="sheet-actions"><button type="submit" class="btn">Salvar</button><button type="button" class="btn ghost" data-act="sheet-close">Cancelar</button></div>';
  }

  function openTaskSheet(kind, id, date) {
    var t = kind === 'task' ? findTask(id) : findSeries(id);
    if (!t) return;
    var isSeries = kind === 'series';
    var kindSel = isSeries ? ruleKind(t.rule) : 'none';
    var custom = isSeries && t.rule.type === 'days' && kindSel === 'custom' ? t.rule.days : [];
    var html = '<h3 id="sheetTitle">Editar tarefa</h3><form id="sheetForm" autocomplete="off">' +
      '<label class="fld"><span>Tarefa</span><input type="text" id="fText" value="' + esc(t.text) + '" maxlength="140" required></label>' +
      (isSeries ? '<p>Esta tarefa se repete. Você está editando o dia ' + esc(longDate(date)) + '.</p>' : '<label class="fld"><span>Dia</span><input type="date" id="fDate" value="' + esc(t.date) + '" required></label>') +
      '<div class="fld inline"><span>Hora (opcional)</span><div class="inline"><input type="time" id="fTime" value="' + esc(t.time) + '"><button type="button" class="link-btn" data-act="clear-time">Sem hora</button></div></div>' +
      '<div class="fld"><span>Etiqueta</span><div class="chips" id="fCats" style="margin:0">' + catChips(t.cat) + '</div></div>' +
      '<div class="fld"><span>Prioridade</span><div class="chips" id="fPri" style="margin:0">' + priChips(t.pri || 0) + '</div></div>' +
      '<label class="fld"><span>Repetir</span>' + repeatSelect('fRepeat', kindSel) + '</label>' +
      '<div class="chips" id="fChips"' + (kindSel === 'custom' ? '' : ' hidden') + '>' + chipsHtml(custom) + '</div>' +
      actionsHtml() + '</form>';
    openSheet({ type: 'task', kind: kind, id: id, date: date }, html);
  }
  function openScope(mode) {
    sheetCtx.mode = mode;
    $('#sheetPanel').innerHTML = '<h3 id="sheetTitle">Tarefa recorrente</h3><p>' + (mode === 'delete' ? 'Esta tarefa se repete. O que você quer apagar?' : 'Esta tarefa se repete. Onde aplicar a alteração?') + '</p>' +
      '<div class="sheet-actions col"><button type="button" class="btn" data-act="scope" data-scope="one">Só esta</button>' +
      '<button type="button" class="btn" data-act="scope" data-scope="future">Esta e as próximas</button>' +
      '<button type="button" class="btn ghost" data-act="sheet-close">Cancelar</button></div>';
  }
  function openHabitSheet(id) {
    var h = findHabit(id);
    if (!h) return;
    openSheet({ type: 'habit', id: id }, '<h3 id="sheetTitle">Editar hábito</h3><form id="sheetForm" autocomplete="off"><label class="fld"><span>Nome</span><input type="text" id="fText" value="' + esc(h.name) + '" maxlength="60" required></label>' +
      '<label class="fld"><span>Meta</span>' + targetSelect('fTarget', h.target) + '</label>' + actionsHtml() + '</form>');
  }
  function openNoteSheet(id) {
    var n = state.notes.find(function (x) { return x.id === id; });
    if (!n) return;
    openSheet({ type: 'note', id: id }, '<h3 id="sheetTitle">Editar nota</h3><form id="sheetForm" autocomplete="off"><label class="fld"><span>Nota</span><textarea id="fText" maxlength="4000" required>' + esc(n.text) + '</textarea></label>' + actionsHtml() + '</form>');
  }

  function catRowHtml(c) {
    return '<div class="catrow" data-id="' + esc(c.id) + '" data-color="' + c.color + '"><button type="button" class="swatch" data-act="cat-color" style="--cc:var(--c' + c.color + ')" aria-label="Mudar cor"></button>' +
      '<input type="text" value="' + esc(c.name) + '" maxlength="20" aria-label="Nome da etiqueta" placeholder="Nome">' +
      '<button type="button" class="x" data-act="cat-rm" aria-label="Remover etiqueta">' + XICON + '</button></div>';
  }
  function openCatsSheet(addNew) {
    openSheet({ type: 'cats' }, '<h3 id="sheetTitle">Etiquetas</h3><form id="sheetForm" autocomplete="off"><div id="catRows">' + (state.cats || []).map(catRowHtml).join('') + '</div>' +
      '<p><button type="button" class="link-btn" data-act="cat-add">+ Nova etiqueta</button></p>' + actionsHtml() + '</form>');
    if (addNew) addCatRow();
  }
  function addCatRow() {
    var used = $$('#catRows .catrow').map(function (r) { return +r.getAttribute('data-color'); });
    var col = 0;
    for (var i = 0; i < 8; i++) { if (used.indexOf(i) < 0) { col = i; break; } }
    $('#catRows').insertAdjacentHTML('beforeend', catRowHtml({ id: '', name: '', color: col }));
    var ins = $$('#catRows input'); ins[ins.length - 1].focus();
  }

  function saveSheet() {
    var c = sheetCtx;
    if (!c) return;
    if (c.type === 'cats') {
      var list = [];
      $$('#catRows .catrow').forEach(function (r) {
        var nm = r.querySelector('input').value.trim();
        if (nm) list.push({ id: r.getAttribute('data-id') || uid(), name: nm, color: +r.getAttribute('data-color') || 0 });
      });
      state.cats = list;
      closeSheet(); commit();
      return;
    }
    var text = ($('#fText').value || '').trim();
    if (!text) return;
    if (c.type === 'habit') {
      var h = findHabit(c.id);
      if (h) { h.name = text; h.target = parseInt($('#fTarget').value, 10) || 0; }
      closeSheet(); commit();
    } else if (c.type === 'note') {
      var n = state.notes.find(function (x) { return x.id === c.id; });
      if (n) n.text = text;
      closeSheet(); commit();
    } else if (c.type === 'task') {
      var time = $('#fTime').value || '';
      var ecat = pickedCat('#fCats'), epri = pickedPri('#fPri');
      var rv = $('#fRepeat').value;
      if (c.kind === 'task') {
        var t = findTask(c.id);
        if (!t) { closeSheet(); return; }
        var date = $('#fDate').value || t.date;
        if (rv === 'none') { t.text = text; t.time = time; t.date = date; t.cat = ecat; t.pri = epri; }
        else {
          var done = {};
          if (t.done) done[date] = 1;
          state.tasks = state.tasks.filter(function (x) { return x !== t; });
          state.series.push({ id: uid(), text: text, time: time, rule: buildRule(rv, $('#fChips'), date, null), start: date, end: '', done: done, skip: {}, cat: ecat, pri: epri, created: t.created || Date.now() });
        }
        closeSheet(); commit();
      } else {
        var s = findSeries(c.id);
        if (!s) { closeSheet(); return; }
        c.pending = { text: text, time: time, cat: ecat, pri: epri, rule: rv === 'none' ? null : buildRule(rv, $('#fChips'), c.date, s.rule) };
        openScope('edit');
      }
    }
  }

  function endSeriesBefore(s, key) {
    Object.keys(s.done).forEach(function (k) { if (k >= key) delete s.done[k]; });
    Object.keys(s.skip).forEach(function (k) { if (k >= key) delete s.skip[k]; });
    var prev = ymd(addDays(parseKey(key), -1));
    if (prev < s.start) state.series = state.series.filter(function (x) { return x !== s; });
    else s.end = prev;
  }
  function applyScope(scope) {
    var c = sheetCtx;
    var s = c && findSeries(c.id);
    if (!s) { closeSheet(); return; }
    var key = c.date, today = ymd(new Date());
    var snap = JSON.stringify(state);
    function standalone(p, wasDone) {
      state.tasks.push({ id: uid(), text: p.text, done: wasDone, doneOn: wasDone ? today : '', date: key, time: p.time, cat: p.cat, pri: p.pri, created: Date.now() });
    }
    if (c.mode === 'delete') {
      if (scope === 'one') { s.skip[key] = 1; delete s.done[key]; } else endSeriesBefore(s, key);
      closeSheet(); commit();
      undoSnap = snap; showToast('Tarefa removida.', true);
      return;
    }
    var p = c.pending;
    if (scope === 'one') {
      var wd = !!s.done[key];
      s.skip[key] = 1; delete s.done[key];
      standalone(p, wd);
    } else if (!p.rule) {
      var wd2 = !!s.done[key];
      endSeriesBefore(s, key);
      standalone(p, wd2);
    } else if (key <= s.start) {
      s.text = p.text; s.time = p.time; s.rule = p.rule; s.cat = p.cat; s.pri = p.pri;
    } else {
      var ns = { id: uid(), text: p.text, time: p.time, rule: p.rule, start: key, end: s.end, done: {}, skip: {}, cat: p.cat, pri: p.pri, created: Date.now() };
      Object.keys(s.done).forEach(function (k) { if (k >= key) { ns.done[k] = 1; delete s.done[k]; } });
      Object.keys(s.skip).forEach(function (k) { if (k >= key) { ns.skip[k] = 1; delete s.skip[k]; } });
      s.end = ymd(addDays(parseKey(key), -1));
      state.series.push(ns);
    }
    closeSheet(); commit();
  }

  /* ---------- Ações ---------- */
  document.addEventListener('click', function (e) {
    if (e.target.id === 'sheet') { closeSheet(); return; }
    if (calOpen && !e.target.closest('#cal') && !e.target.closest('#dateTile')) closeCal(false);
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    var now = new Date();
    if (act === 'item-toggle') {
      var kind = b.getAttribute('data-kind'), date = b.getAttribute('data-date');
      if (kind === 'task') {
        var t = findTask(id);
        if (!t) return;
        t.done = !t.done; t.doneOn = t.done ? ymd(now) : '';
      } else {
        var s = findSeries(id);
        if (!s) return;
        if (s.done[date]) delete s.done[date]; else s.done[date] = 1;
      }
      commit();
    } else if (act === 'item-edit') {
      openTaskSheet(b.getAttribute('data-kind'), id, b.getAttribute('data-date'));
    } else if (act === 'item-del') {
      var k2 = b.getAttribute('data-kind');
      if (k2 === 'task') destructive('Tarefa', function () { state.tasks = state.tasks.filter(function (x) { return x.id !== id; }); });
      else { sheetCtx = { type: 'task', kind: 'series', id: id, date: b.getAttribute('data-date') }; $('#sheet').hidden = false; openScope('delete'); }
    } else if (act === 'habit-toggle') {
      var hb = findHabit(id);
      var day = b.getAttribute('data-day');
      if (!hb || day > ymd(now)) return;
      if (hb.days[day]) delete hb.days[day]; else hb.days[day] = 1;
      commit();
    } else if (act === 'habit-edit') { openHabitSheet(id); }
    else if (act === 'habit-del') { destructive('Hábito', function () { state.habits = state.habits.filter(function (x) { return x.id !== id; }); }); }
    else if (act === 'note-edit') { openNoteSheet(id); }
    else if (act === 'note-del') { destructive('Nota', function () { state.notes = state.notes.filter(function (x) { return x.id !== id; }); }); }
    else if (act === 'mood-set') {
      var v = parseInt(b.getAttribute('data-v'), 10), key = selKey();
      if (state.moods[key] === v) delete state.moods[key]; else state.moods[key] = v;
      commit();
    } else if (act === 'hist-open') { openHist(); }
    else if (act === 'hist-close') { closeHist(); }
    else if (act === 'hist-prev' || act === 'hist-next') {
      histMonth = new Date(histMonth.getFullYear(), histMonth.getMonth() + (act === 'hist-next' ? 1 : -1), 1);
      render();
    } else if (act === 'cal-prev' || act === 'cal-next') {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (act === 'cal-next' ? 1 : -1), 1);
      renderCal();
      var nb = $('#cal [data-act="' + act + '"]');
      if (nb) nb.focus();
    } else if (act === 'cal-pick') { pickDay(b.getAttribute('data-date')); }
    else if (act === 'cal-today') { pickDay(ymd(now)); }
    else if (act === 'cat-pick') { var on = b.getAttribute('aria-pressed') === 'true'; $$('#' + b.parentNode.id + ' .chip[data-cat]').forEach(function (c2) { c2.setAttribute('aria-pressed', 'false'); }); if (!on) b.setAttribute('aria-pressed', 'true'); }
    else if (act === 'pri-pick') { $$('#' + b.parentNode.id + ' .chip[data-pri]').forEach(function (c2) { c2.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); }
    else if (act === 'cat-new') { if (!sheetCtx) openCatsSheet(true); }
    else if (act === 'cat-manage') { openCatsSheet(false); }
    else if (act === 'cat-filter') { catFilter = b.getAttribute('data-cat') || ''; render(); }
    else if (act === 'cat-color') { var row = b.closest('.catrow'); var nc = ((+row.getAttribute('data-color')) + 1) % 8; row.setAttribute('data-color', nc); b.style.setProperty('--cc', 'var(--c' + nc + ')'); }
    else if (act === 'cat-rm') { b.closest('.catrow').remove(); }
    else if (act === 'cat-add') { addCatRow(); }
    else if (act === 'chip') { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); }
    else if (act === 'clear-time') { var ft = $('#fTime'); if (ft) ft.value = ''; }
    else if (act === 'sheet-close') { closeSheet(); }
    else if (act === 'scope') { applyScope(b.getAttribute('data-scope')); }
    else if (act === 'clear-sample') { state = emptyState(); commit(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'taskRepeat') $('#taskChips').hidden = t.value !== 'custom';
    if (t.id === 'fRepeat') $('#fChips').hidden = t.value !== 'custom';
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'sheetForm') { e.preventDefault(); saveSheet(); }
  });

  $('#taskForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#taskInput'), v = inp.value.trim();
    if (!v) return;
    var key = selKey(), time = $('#taskTime').value || '', rv = $('#taskRepeat').value;
    if (rv === 'none') {
      state.tasks.push({ id: uid(), text: v, done: false, doneOn: '', date: key, time: time, cat: pickedCat('#taskCats'), pri: pickedPri('#taskPri'), created: Date.now() });
      commit();
    } else {
      var rule = buildRule(rv, $('#taskChips'), key, null);
      state.series.push({ id: uid(), text: v, time: time, rule: rule, start: key, end: '', done: {}, skip: {}, cat: pickedCat('#taskCats'), pri: pickedPri('#taskPri'), created: Date.now() });
      commit();
      var f = firstOn(rule, key);
      if (f !== key) showToast('Começa em ' + longDate(f) + '.', false);
    }
    inp.value = ''; $('#taskTime').value = ''; $('#taskRepeat').value = 'none';
    $('#taskPri').innerHTML = priChips(0);
    $$('#taskCats .chip[data-cat]').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
    $('#taskChips').hidden = true;
    $$('#taskChips .chip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
    $('#taskMore').open = false;
    inp.focus();
  });
  $('#habitForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#habitInput'), v = inp.value.trim();
    if (!v) return;
    state.habits.push({ id: uid(), name: v, target: parseInt($('#habitTarget').value, 10) || 0, days: {} });
    inp.value = ''; $('#habitTarget').value = '0'; commit(); inp.focus();
  });
  $('#noteForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#noteInput'), v = inp.value.trim();
    if (!v) return;
    state.notes.push({ id: uid(), date: selKey(), text: v, created: Date.now() });
    inp.value = ''; commit(); inp.focus();
  });

  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  document.addEventListener('contextmenu', function (e) { if (!e.target.closest('input, textarea')) e.preventDefault(); });


  /* ---------- Calendário ---------- */
  function renderCal() {
    var el = $('#cal');
    var today = ymd(new Date()), sk = selKey();
    var y = calMonth.getFullYear(), m = calMonth.getMonth();
    var offset = (calMonth.getDay() + 6) % 7;
    var total = new Date(y, m + 1, 0).getDate();
    var rows = Math.ceil((offset + total) / 7);
    var start = weekStart(calMonth);
    var by = {};
    state.tasks.forEach(function (t) {
      var o = by[t.date] || (by[t.date] = { n: 0, done: 0 });
      o.n++;
      if (t.done) o.done++;
    });
    var wkh = '';
    for (var i = 0; i < 7; i++) wkh += '<span>' + DIAS[(i + 1) % 7] + '</span>';
    var cells = '';
    for (var j = 0; j < rows * 7; j++) {
      var d = addDays(start, j), key = ymd(d);
      var info = by[key] ? { n: by[key].n, done: by[key].done } : { n: 0, done: 0 };
      state.series.forEach(function (s) { if (seriesOn(s, key)) { info.n++; if (s.done[key]) info.done++; } });
      var mv = state.moods[key];
      var all = info.n > 0 && info.done === info.n;
      cells += '<button type="button" class="cal-day' + (d.getMonth() !== m ? ' other' : '') + (key === today ? ' today' : '') + (key === sk ? ' sel' : '') +
        '" data-act="cal-pick" data-date="' + key + '" aria-pressed="' + (key === sk) + '"' + (key === today ? ' aria-current="date"' : '') +
        ' aria-label="' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() + (info.n ? ', ' + info.done + ' de ' + info.n + (info.n === 1 ? ' tarefa feita' : ' tarefas feitas') : '') + (mv ? ', humor ' + MOODS[mv - 1] : '') + '">' +
        '<span class="num' + (mv ? ' mood' : '') + '"' + (mv ? ' style="--mc:var(--m' + mv + ')"' : '') + '>' + d.getDate() + '</span>' +
        '<i class="tdot ' + (info.n ? (all ? 'ok' : 'pend') : 'none') + '"></i></button>';
    }
    el.innerHTML = '<div class="cal-head"><button type="button" class="step" data-act="cal-prev" aria-label="Mês anterior">&lsaquo;</button>' +
      '<span class="cal-title">' + cap(MESES[m]) + ' ' + y + '</span>' +
      '<button type="button" class="step" data-act="cal-next" aria-label="Próximo mês">&rsaquo;</button></div>' +
      '<div class="cal-week" aria-hidden="true">' + wkh + '</div><div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-foot"><button type="button" class="link-btn" data-act="cal-today">Ir para hoje</button>' +
      '<div class="cal-legend" aria-hidden="true"><span><i class="tdot pend"></i>Falta fazer</span><span><i class="tdot ok"></i>Tudo feito</span></div></div>';
  }
  function openCal() {
    var s = parseKey(selKey());
    calMonth = new Date(s.getFullYear(), s.getMonth(), 1);
    calOpen = true;
    $('#cal').hidden = false;
    $('#dateTile').setAttribute('aria-expanded', 'true');
    renderCal();
    var b = $('#cal .cal-day.sel');
    if (b) b.focus();
  }
  function closeCal(refocus) {
    if (!calOpen) return;
    calOpen = false;
    $('#cal').hidden = true;
    $('#dateTile').setAttribute('aria-expanded', 'false');
    if (refocus) $('#dateTile').focus();
  }
  function pickDay(key) {
    sel = key === ymd(new Date()) ? null : key;
    closeCal(true);
    render();
  }
  $('#dateTile').addEventListener('click', function () { if (calOpen) closeCal(false); else openCal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#sheet').hidden) closeSheet();
    else if (calOpen) closeCal(true);
    else if (histOpen) closeHist();
  });

  /* ---------- Abas e deslize lateral ---------- */
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function mark(i) {
    current = i;
    $('.wrap').setAttribute('data-tab', String(i));
    tabs.forEach(function (t, k) {
      t.setAttribute('aria-selected', k === i ? 'true' : 'false');
      t.tabIndex = k === i ? 0 : -1;
    });
    try { localStorage.setItem(TAB_KEY, String(i)); } catch (e) {}
  }
  var ind, tabsEl, hold = 1, stretch = 0, side = 1, srcs = { drag: 0, touch: 0, native: 0 }, snapTimer = 0, justDragged = false;
  function paintInd() {
    var o = Math.max(srcs.drag, srcs.touch, srcs.native);
    var sq = o / (o + 0.55);
    var st = stretch * (1 - sq);
    var sx = hold * (1 - 0.42 * sq) * (1 + st);
    var sy = hold * (1 + 0.14 * sq) * (1 - st * 0.4);
    if (sq > 0.02) ind.style.transformOrigin = side < 0 ? '0% 50%' : '100% 50%';
    ind.style.scale = sx.toFixed(3) + ' ' + sy.toFixed(3);
  }
  function setInd() {
    var w = pager.clientWidth;
    if (!w) return;
    var p = pager.scrollLeft / w;
    tabsEl.style.setProperty('--p', Math.max(0, Math.min(tabs.length - 1, p)).toFixed(3));
    /* o iPhone estica a lista além das pontas: a bolinha se amassa junto */
    var over = p < 0 ? -p : p > tabs.length - 1 ? p - (tabs.length - 1) : 0;
    if (over || srcs.native) { srcs.native = over * 2.2; if (over) side = p < 0 ? -1 : 1; paintInd(); }
  }
  function go(i, instant) {
    i = Math.max(0, Math.min(tabs.length - 1, i));
    if (instant) tabsEl.style.setProperty('--p', String(i));
    lockUntil = Date.now() + 500;
    pager.scrollTo({ left: i * pager.clientWidth, behavior: (instant || reduce) ? 'auto' : 'smooth' });
    mark(i);
    setTimeout(syncFromScroll, 550);
  }
  function syncFromScroll() {
    if (Date.now() < lockUntil || !pager.clientWidth) return;
    var i = Math.round(pager.scrollLeft / pager.clientWidth);
    if (i !== current && i >= 0 && i < tabs.length) mark(i);
  }
  /* Arrastar a bolinha da barra e amassar nas pontas */
  function setupGestures() {
    var pd = null;
    function clampP(x) { return Math.max(0, Math.min(tabs.length - 1, x)); }
    tabsEl.addEventListener('pointerdown', function (e) {
      if (e.button > 0 || pd) return;
      pd = { id: e.pointerId, x: e.clientX, p0: pager.scrollLeft / pager.clientWidth, moved: false, raw: 0, v: 0, s: [[e.timeStamp, e.clientX]] };
      pd.raw = pd.p0;
      ind.style.transformOrigin = '50% 50%';
      hold = 1.1; stretch = 0; paintInd();
      tabsEl.classList.add('held');
    });
    tabsEl.addEventListener('pointermove', function (e) {
      if (!pd || e.pointerId !== pd.id) return;
      var dx = e.clientX - pd.x;
      if (!pd.moved) {
        if (Math.abs(dx) < 6) return;
        pd.moved = true;
        try { tabsEl.setPointerCapture(e.pointerId); } catch (err) {}
        tabsEl.classList.add('live');
        clearTimeout(snapTimer);
        pager.style.scrollSnapType = 'none';
        lockUntil = 0;
      }
      var iw = (tabsEl.clientWidth - 12) / tabs.length;
      var raw = pd.p0 + dx / iw, last = tabs.length - 1;
      pd.raw = raw;
      srcs.drag = raw < 0 ? -raw : raw > last ? raw - last : 0;
      if (srcs.drag) side = raw < 0 ? -1 : 1;
      pd.s.push([e.timeStamp, e.clientX]);
      while (pd.s.length > 2 && e.timeStamp - pd.s[0][0] > 100) pd.s.shift();
      var a = pd.s[0], b = pd.s[pd.s.length - 1];
      pd.v = b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) / iw : 0;
      stretch = Math.min(0.12, Math.abs(pd.v) * 40);
      var p = clampP(raw);
      pager.scrollLeft = p * pager.clientWidth;
      tabsEl.style.setProperty('--p', p.toFixed(3));
      paintInd();
    });
    function endDrag(e, cancel) {
      if (!pd || e.pointerId !== pd.id) return;
      var d = pd; pd = null;
      hold = 1; stretch = 0; srcs.drag = 0;
      tabsEl.classList.remove('held', 'live');
      paintInd();
      if (!d.moved) return;
      justDragged = true;
      setTimeout(function () { justDragged = false; }, 350);
      var target = Math.round(clampP(d.raw) + (cancel ? 0 : d.v * 160));
      go(target);
      snapTimer = setTimeout(function () { pager.style.scrollSnapType = ''; }, 650);
    }
    tabsEl.addEventListener('pointerup', function (e) { endDrag(e, false); });
    tabsEl.addEventListener('pointercancel', function (e) { endDrag(e, true); });
    tabsEl.addEventListener('click', function (e) { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);

    /* deslizar o conteúdo além da última (ou primeira) tela */
    var tch = null;
    pager.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      var t = e.touches[0], max = pager.scrollWidth - pager.clientWidth;
      tch = { x: t.clientX, y: t.clientY, l: pager.scrollLeft <= 1, r: pager.scrollLeft >= max - 1 };
    }, { passive: true });
    pager.addEventListener('touchmove', function (e) {
      if (!tch || e.touches.length !== 1) return;
      var t = e.touches[0], dx = t.clientX - tch.x, dy = t.clientY - tch.y, o = 0;
      if (Math.abs(dx) > Math.abs(dy) * 1.2) {
        if (tch.l && dx > 0) { o = dx; side = -1; }
        else if (tch.r && dx < 0) { o = -dx; side = 1; }
      }
      srcs.touch = o / pager.clientWidth * 2.2;
      if (o) tabsEl.classList.add('live');
      paintInd();
    }, { passive: true });
    function endTouch() {
      tch = null;
      if (!srcs.touch) return;
      srcs.touch = 0;
      tabsEl.classList.remove('live');
      paintInd();
    }
    pager.addEventListener('touchend', endTouch, { passive: true });
    pager.addEventListener('touchcancel', endTouch, { passive: true });
  }
  function setupTabs() {
    pager = $('#pager');
    tabs = $$('.tab');
    tabsEl = $('.tabs');
    ind = $('.glass-ind');
    var ticking = false;
    pager.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { ticking = false; setInd(); syncFromScroll(); });
    });
    tabs.forEach(function (t, k) {
      t.addEventListener('click', function () { go(k); });
      t.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var n = Math.max(0, Math.min(tabs.length - 1, current + (e.key === 'ArrowRight' ? 1 : -1)));
        go(n);
        tabs[n].focus();
      });
    });
    setupGestures();
    window.addEventListener('resize', function () {
      pager.scrollTo({ left: current * pager.clientWidth, behavior: 'auto' });
      setInd();
    });
  }

  /* ---------- Início ---------- */
  var saved = loadLocal();
  localHad = !!saved;
  state = saved || sampleState();
  lastJson = JSON.stringify(state);
  var t0 = new Date();
  histMonth = new Date(t0.getFullYear(), t0.getMonth(), 1);
  $('#taskChips').innerHTML = chipsHtml([]);
  $('#taskPri').innerHTML = priChips(0);
  setupTabs();
  setStatus('Seus dados estão salvos neste navegador.');
  render();
  var startTab = 0;
  try { startTab = parseInt(localStorage.getItem(TAB_KEY), 10) || 0; } catch (e) {}
  go(Math.min(startTab, 2), true);
  connect();
})();
</script>

<script>
(function () {
  var KEY = 'painel-da-vida-v1';
  function el(id) { return document.getElementById(id); }
  el('bkExport').addEventListener('click', function () {
    var raw = ''; try { raw = localStorage.getItem(KEY) || ''; } catch (e) {}
    if (!raw) { alert('Ainda não há dados para exportar.'); return; }
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    var name = 'painel-da-vida-backup-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.json';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  });
  el('bkImport').addEventListener('click', function () { el('bkFile').click(); });
  el('bkFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var d; try { d = JSON.parse(String(r.result)); } catch (err) { d = null; }
      if (!d || typeof d !== 'object' || !Array.isArray(d.tasks) || !Array.isArray(d.habits)) { alert('Este arquivo não parece um backup do Painel da Vida.'); return; }
      if (!confirm('Substituir os dados atuais por este backup?')) return;
      d.sample = false;
      try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (err) { alert('Não foi possível importar.'); return; }
      location.reload();
    };
    r.readAsText(f);
    e.target.value = '';
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
